<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;O Brothers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-elevated: #eeecef;
    --sidebar: #ffffff;
    --card: #ffffff;
    --card-hover: #f7f7f7;
    --card-border: #dddddd;
    --card-border-soft: #ebebeb;
    --accent: #ff385c;
    --accent-dim: #ffd9df;
    --accent-strong: #d70466;
    --accent-tint: rgba(255,56,92,.08);
    --gold: #b8860b;
    --text: #222222;
    --muted: #717171;
    --muted-dim: #b0b0b0;
    --green: #16794d;
    --green-tint: rgba(22,121,77,.08);
    --red: #c13515;
    --red-tint: rgba(193,53,21,.08);
    --yellow: #e0a823;
    --radius-lg: 22px;
    --radius-md: 14px;
    --radius-sm: 10px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.05);
    --shadow-pop: 0 1px 2px rgba(0,0,0,.08), 0 10px 24px rgba(0,0,0,.08);
    /* ---- Dashboard-Look aus dem TikTok-Referenzvideo ("Dashboard V18") --
       Farben per Pixel-Probe direkt aus den Video-Frames gemessen, damit es
       wirklich 1:1 passt statt nur ähnlich zu sein:
       - Sidebar-Schwarz:       #141215
       - Seitenhintergrund:     #eeecef
       - Verlauf links (lila):  #c9bce7
       - Verlauf rechts (pink): #f1c8ef
       - aktiver Icon-Kreis:    #d9d0f2
       ---- */
    --sidebar-dark: #141215;
    --sidebar-dark-hover: rgba(255,255,255,.08);
    --sidebar-dark-active-circle: #d9d0f2;
    --sidebar-dark-icon: rgba(255,255,255,.62);
    --sidebar-dark-icon-active: #1c1430;
    --grad-hero: linear-gradient(90deg, #c9bce7 0%, #ddccf0 45%, #f1c8ef 100%);
    --hero-text: #1e1530;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-elevated);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  ::selection { background: rgba(255,56,92,.2); }

  .app-shell { display: flex; min-height: 100vh; }

  /* ---------- SIDEBAR ---------- */
  /* 1:1 am "Dashboard V18"-Referenzvideo: schmale schwarze Stadion-Pille,
     reine Icons (keine Text-Labels, keine bunten Emojis -- dünne weiße
     Strich-Icons wie im Video), aktives Icon = heller lila Kreis mit
     dunklem Icon darin. Beschriftung kommt im Video selbst erst durch
     ein Tooltip beim Hover -- das bauen wir hier genauso nach. */
  .sidebar {
    width: 72px;
    flex-shrink: 0;
    background: var(--sidebar-dark);
    border-right: none;
    border-radius: 999px;
    margin: 18px 0 18px 18px;
    padding: 20px 0;
    position: sticky;
    top: 18px;
    height: calc(100vh - 36px);
    display: flex;
    flex-direction: column;
    align-items: center;
    box-shadow: 0 14px 34px rgba(0,0,0,.2);
  }
  .brand { display: flex; justify-content: center; padding: 2px 0 20px; }
  .brand .mark {
    width: 32px; height: 20px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .brand .mark svg { display: block; }
  .brand .name { display: none; } /* Wortmarke steht nur noch auf der Login-Seite, nicht mehr in der schmalen Pille */

  nav.tabs { display: flex; flex-direction: column; gap: 6px; align-items: center; margin-top: 4px; }
  nav.tabs button {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px;
    background: none; border: none;
    color: var(--sidebar-dark-icon);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    transition: color .15s ease, background .15s ease;
  }
  nav.tabs button .ico { display: flex; width: 18px; height: 18px; }
  nav.tabs button .ico svg, .sidebar-foot button .ico svg { width: 100%; height: 100%; }
  nav.tabs button:hover { color: #fff; background: var(--sidebar-dark-hover); }
  nav.tabs button.active {
    color: var(--sidebar-dark-icon-active);
    background: var(--sidebar-dark-active-circle);
  }
  /* Tooltip beim Hover/Fokus -- genau das Verhalten aus dem Video (dort
     poppt z.B. "Profile" oder "Cloud" neben dem Icon auf, sobald man
     draufgeht). Ersetzt die weggefallenen Text-Labels. */
  nav.tabs button::after {
    content: attr(data-label);
    position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #1c1a1e; color: #fff; font-size: 12px; font-weight: 600; font-family: "Inter", sans-serif;
    padding: 6px 11px; border-radius: 999px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .12s ease;
    box-shadow: var(--shadow-pop);
    z-index: 20;
  }
  nav.tabs button:hover::after, nav.tabs button:focus-visible::after { opacity: 1; }
  /* Abmelden-Icon ganz unten in der Pille -- wie das Exit-Icon am Ende
     der Sidebar im Referenzvideo. Gleiche Kreis-Mechanik wie oben, nur
     ohne "aktiv"-Zustand (es ist kein Ansichts-Tab). */
  .sidebar-foot { margin-top: auto; padding-top: 10px; }
  .sidebar-foot button {
    display: flex; align-items: center; justify-content: center;
    width: 42px; height: 42px; background: none; border: none; cursor: pointer;
    color: var(--sidebar-dark-icon); border-radius: 50%; position: relative;
    transition: color .15s ease, background .15s ease;
  }
  .sidebar-foot button .ico { display: flex; width: 18px; height: 18px; }
  .sidebar-foot button:hover { color: #fff; background: var(--sidebar-dark-hover); }
  .sidebar-foot button::after {
    content: attr(data-label);
    position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%);
    background: #1c1a1e; color: #fff; font-size: 12px; font-weight: 600; font-family: "Inter", sans-serif;
    padding: 6px 11px; border-radius: 999px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity .12s ease;
    box-shadow: var(--shadow-pop); z-index: 20;
  }
  .sidebar-foot button:hover::after, .sidebar-foot button:focus-visible::after { opacity: 1; }

  /* ---------- MAIN ---------- */
  .main { flex: 1; min-width: 0; padding: 44px 50px 110px; max-width: 1260px; }
  .page-head { margin-bottom: 34px; }
  .page-head h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 640px; letter-spacing: .005em; }

  .view { display: none; }
  .view.active { display: block; animation: fadeslide .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeslide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .toggle-group { display: inline-flex; border: 1px solid var(--card-border); border-radius: 999px; overflow: hidden; margin-bottom: 4px; background: var(--bg-elevated); }
  .toggle-btn {
    background: transparent; border: none; color: var(--muted); padding: 9px 18px;
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    letter-spacing: 0; transition: background .15s ease, color .15s ease;
  }
  .toggle-btn:not(:last-child) { border-right: 1px solid var(--card-border); }
  .toggle-btn.active { background: var(--accent); color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 26px 28px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 18px; color: var(--text); font-weight: 700; display:flex; align-items:center; gap:10px; letter-spacing: 0; }
  .card h3 { font-size: 12px; margin: 22px 0 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }

  /* ---------- Objekt "Listing"-Darstellung ---------- */
  .listing-hero {
    position: relative; width: 100%;
    height: 260px; border-radius: var(--radius-md); overflow: hidden;
    margin-bottom: 22px;
    background: var(--bg-elevated);
    border: 1px solid var(--card-border-soft);
  }
  .listing-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .listing-hero .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.05) 48%, transparent 72%);
  }
  .listing-hero .overlay-text {
    position: absolute; left: 26px; right: 26px; bottom: 20px; color: #fff;
  }
  .listing-hero .overlay-text .addr { font-size: 22px; font-weight: 700; letter-spacing: 0; }
  .listing-hero .overlay-text .meta { font-size: 12px; opacity: .85; margin-top: 5px; letter-spacing: .02em; }
  .listing-hero.placeholder { display: flex; align-items: center; justify-content: center; font-size: 36px; opacity: .35; }
  .listing-hero .view-btn {
    position: absolute; right: 18px; bottom: 18px; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 700; box-shadow: var(--shadow-pop);
  }

  .objekt-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .objekt-thumb {
    width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover;
    border: 1px solid var(--card-border-soft); flex-shrink: 0;
    background: var(--bg);
  }
  .objekt-thumb.placeholder {
    display:flex; align-items:center; justify-content:center; font-size:18px; color: var(--muted-dim);
    background: var(--bg-elevated);
  }
  .objekt-photo-large {
    width: 100%; border-radius: var(--radius-md); border: 1px solid var(--card-border-soft);
    display: block; margin-bottom: 16px; object-fit: cover; max-height: 300px;
  }

  .grid-kpi {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--card-border-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    padding: 18px 19px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .kpi:hover { border-color: var(--card-border); }
  .kpi .label { font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  /* Icon-Badge vor dem Label -- wie bei den Stat-Kacheln im Referenzvideo
     (kleines farbiges Quadrat mit Symbol, Label daneben). Bisher nur auf
     den 5 Übersichts-Kacheln im Dashboard eingesetzt, nicht in jeder
     einzelnen Kennzahl-Kachel der ganzen App -- das wäre für jede der
     gut 20 Kennzahlen eine eigene Icon-Entscheidung gewesen, die den
     Rahmen gesprengt hätte. */
  .kpi-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .kpi-row .label { margin-bottom: 0; }
  .kpi-icon {
    width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; line-height: 1;
  }
  .kpi-icon.green { background: var(--green-tint); color: var(--green); }
  .kpi-icon.red { background: var(--red-tint); color: var(--red); }
  .kpi-icon.purple { background: rgba(139,92,246,.14); color: #6d28d9; }
  .kpi-icon.gray { background: var(--bg-elevated); color: var(--muted); }
  .kpi-icon.onhero { background: rgba(0,0,0,.08); color: var(--hero-text); }
  .kpi .value { font-size: 23px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--text); }
  .kpi .value.green { color: var(--green); }
  .kpi .value.red { color: var(--red); }
  .kpi .sub-note { font-size: 11px; color: var(--muted-dim); margin-top: 7px; letter-spacing: 0; }
  /* Die wichtigste Kennzahl bekommt den lila-pinken Verlauf aus dem
     Referenzvideo statt des alten rosa Tints -- hebt sie als "Blickfang"-
     Kachel ab, genau wie die farbigen Stat-Kacheln im Video. */
  .kpi.hero { background: var(--grad-hero); border-color: transparent; }
  .kpi.hero:hover { border-color: transparent; }
  .kpi.hero .label { color: rgba(0,0,0,.55); }
  .kpi.hero .sub-note { color: rgba(0,0,0,.45); }

  /* ---------- Begrüßungs-Karte (Dashboard) ----------
     1:1 am Video: Verlauf horizontal lila -> pink, fette dunkle
     Überschrift + graue zweizeilige Unterzeile links, schwarzer
     Pillen-Button rechts daneben, verschwommene lila-pinke "Blüte"
     rechts im Bild, die über den Kartenrand hinausbleedet. */
  .hero-banner {
    position: relative;
    background: var(--grad-hero);
    border-radius: var(--radius-lg);
    padding: 26px 30px;
    margin-bottom: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 108px;
  }
  .hero-banner .hero-text { position: relative; z-index: 2; }
  .hero-banner .hero-title {
    font-size: 21px; font-weight: 700; color: var(--hero-text); font-family: "Inter", sans-serif;
    letter-spacing: -.01em; margin-bottom: 6px;
  }
  .hero-banner .hero-sub {
    font-size: 13px; color: rgba(30,21,48,.62); line-height: 1.6; max-width: 380px;
  }
  .hero-banner .hero-btn {
    position: relative; z-index: 2;
    display: inline-flex; align-items: center; gap: 9px; flex-shrink: 0;
    background: #171219; color: #fff; border: none; border-radius: 999px;
    padding: 10px 20px 10px 12px; font-size: 13px; font-weight: 600; font-family: inherit;
    cursor: pointer; white-space: nowrap;
    transition: background .15s ease;
  }
  .hero-banner .hero-btn:hover { background: #2a222f; }
  .hero-banner .hero-btn .plus {
    width: 18px; height: 18px; border-radius: 50%; border: 1.4px solid rgba(255,255,255,.5);
    display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: 1;
  }
  .hero-banner .hero-bloom {
    position: absolute; right: -55px; top: 50%; transform: translateY(-50%);
    width: 260px; height: 260px; border-radius: 50%; filter: blur(1px);
    background:
      radial-gradient(circle at 35% 30%, rgba(255,255,255,.5), transparent 45%),
      radial-gradient(circle at 60% 65%, rgba(167,139,250,.55), transparent 55%),
      radial-gradient(circle at 75% 35%, rgba(236,72,153,.35), transparent 55%),
      radial-gradient(circle at 50% 50%, rgba(139,92,246,.4), transparent 70%);
    opacity: .85;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--card-border-soft); }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: 0; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--card-hover); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
  }
  .tag.green { background: var(--green-tint); color: var(--green); }
  .tag.red { background: var(--red-tint); color: var(--red); }
  .tag.gold { background: rgba(184,134,11,.1); color: var(--gold); }
  .tag.muted { background: var(--bg-elevated); color: var(--muted); }

  form.inline { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-top: 20px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .field input, .field select, .field textarea {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    min-width: 130px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field.wide input, .field.wide textarea { min-width: 230px; }
  .field.checkbox { flex-direction: row; align-items: center; gap: 8px; }
  .field.checkbox label { font-size: 13px; color: var(--text); text-transform: none; font-weight: 400; letter-spacing: 0; }
  .field.checkbox input { min-width: auto; accent-color: var(--accent); width: 16px; height: 16px; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    padding: 11px 22px;
    border-radius: 999px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    letter-spacing: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button.primary:active { opacity: .85; }
  button.ghost {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0;
    transition: border-color .15s ease, background .15s ease;
  }
  button.ghost:hover { border-color: var(--text); background: var(--card-hover); }
  button.danger {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--red);
    padding: 6px 13px;
    border-radius: 999px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  button.danger:hover { background: var(--red-tint); border-color: var(--red-tint); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

  .empty {
    color: var(--muted); font-size: 13px; padding: 36px 0; text-align: center;
    border: 1px dashed var(--card-border); border-radius: var(--radius-md); background: var(--bg-elevated);
    letter-spacing: 0;
  }

  .note { font-size: 12.5px; color: var(--muted); margin-top: 13px; line-height: 1.7; }

  .map-embed {
    width: 100%; height: 280px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-md);
    margin-bottom: 16px;
  }

  .progress-bar {
    width: 100%; height: 6px; border-radius: 999px; background: var(--card-border-soft);
    overflow: hidden; margin: 10px 0 4px;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 999px;
    background: var(--accent);
    transition: width .5s ease;
  }

  .fin-top { display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; margin-bottom: 6px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-md); overflow: hidden; background: var(--card); box-shadow: var(--shadow-card); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; flex-shrink: 0; padding: 20px 28px; border-right: 1px solid var(--card-border-soft); }
  .ring-wrap .ring-label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; max-width: 120px; letter-spacing: 0; }
  .ring-pct { font-size: 18px; font-weight: 800; fill: var(--text); }
  .fin-top .grid-kpi { border: none; flex: 1; gap: 0; margin-bottom: 0; }
  .fin-top .kpi { border: none; border-radius: 0; box-shadow: none; border-left: 1px solid var(--card-border-soft); }
  .fin-top .kpi:first-child { border-left: none; }

  details.edit-box { margin-top: 16px; }
  details.edit-box summary {
    cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; font-weight: 600;
    list-style: none; display: flex; align-items: center; gap: 7px;
    letter-spacing: 0;
  }
  details.edit-box summary:hover { color: var(--text); }
  details.edit-box summary::before { content: "+"; font-size: 13px; transition: transform .15s ease; color: var(--accent); }
  details.edit-box[open] summary::before { transform: rotate(45deg); }
  details.edit-box summary::-webkit-details-marker { display: none; }

  .formula-note {
    background: var(--bg-elevated); border: 1px solid var(--card-border-soft); border-radius: var(--radius-md);
    padding: 15px 18px; font-size: 12.5px; color: var(--muted); margin-top: 15px; line-height: 1.8;
  }
  .formula-note b { color: var(--text); }

  .warn-note {
    background: var(--accent-tint); border: 1px solid var(--accent-dim); border-radius: var(--radius-md);
    padding: 15px 18px; font-size: 12.5px; color: var(--accent-strong); margin-top: 15px; line-height: 1.8;
  }
  .warn-note b { color: var(--text); }
  .warn-note a { color: var(--accent-strong); }

  .serif { font-family: "Fraunces", "Inter", serif; font-weight: 600; }

  .value-split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px;
  }
  .value-split .half { background: var(--card); padding: 26px 28px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .value-split .half.belw { background: #fff8f6; }
  .value-split .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-bottom: 10px; }
  .value-split .big { font-size: 36px; letter-spacing: -.01em; line-height: 1.05; }

// ist. Sobald echte Werte eingetragen sind, schaltet es automatisch auf
// den Firebase-Modus (Login + geräteübergreifender Datenstand) um.
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "FIREBASE_API_KEY";
let auth, db, SHARED_DOC;
if (FIREBASE_CONFIGURED) {

const STORAGE_KEY = "immobilien_app_data_v2";

const KOSTEN_KATEGORIEN = [

  "Mieter-Entschädigung"
]);

function uid() { return Math.random().toString(36).slice(2, 10); }

function defaultData() {
  // Öffentliche Quelle (GitHub Pages) — bewusst NUR erfundene
  // Beispielwerte. Wird seit Firebase-Einrichtung nur noch beim
  // theoretischen Fall eines leeren Firestore-Dokuments verwendet.
  const objektId = "beispielobjekt";

          { id: "eg", name: "EG", flaeche: 75, zimmer: 4, kaltmiete: 800.00, status: "vermietet" },

    ],

    kosten: [
      { id: uid(), objektId, datum: "2026-02-01", kategorie: "Grunderwerbsteuer (Kaufnebenkosten)", betrag: 13000.00, umlagefaehig: false, beschreibung: "Beispiel-Eintrag" },

    ],

      { id: uid(), marke: "Beispielmarke", modell: "Beispielmodell", baujahr: 2010, farbe: "Grau", km: 150000, status: "Bestand", kaufpreis: 1000, investitionGeplant: 300, investitionIst: 0, zielpreis: 1800, verkaufspreis: null, tuevBis: "", partner: "", bildUrl: "", notizen: "Beispiel-Eintrag zum Ausprobieren" }

// DATA wird erst nach erfolgreichem Login gesetzt (siehe Auth-Gate ganz
// unten im Script). Bis dahin ist es undefined -- alle render*()-Funktionen
// werden vor dem ersten erfolgreichen Login nicht aufgerufen.
let DATA;

function normalizeData(parsed) {
  // Fehlende neue Felder bei älteren Datenständen nachrüsten.
  parsed.objekte.forEach(o => {
    if (o.bildUrl === undefined) o.bildUrl = "";
    if (o.kartenAdresse === undefined) o.kartenAdresse = "";
    if (o.darlehenssumme === undefined) o.darlehenssumme = null;
    if (o.zinssatz === undefined) o.zinssatz = null;
    if (o.tilgungssatz === undefined) o.tilgungssatz = null;
    if (o.kreditstart === undefined) o.kreditstart = null;
    if (o.zinsbindungEnde === undefined) o.zinsbindungEnde = null;
    if (o.bodenrichtwert === undefined) o.bodenrichtwert = 0;
    if (o.liegenschaftszins === undefined) o.liegenschaftszins = 3.5;
    if (o.restnutzungsdauer === undefined) o.restnutzungsdauer = 25;
    if (o.nachhaltigeMieteProzent === undefined) o.nachhaltigeMieteProzent = 90;
    if (o.belwertBewirtschaftungProzent === undefined) o.belwertBewirtschaftungProzent = 23;
    if (o.belwertZinsZuschlag === undefined) o.belwertZinsZuschlag = 0.5;
    if (o.belwertSicherheitsabschlagProzent === undefined) o.belwertSicherheitsabschlagProzent = 15;
  });
  if (parsed.fahrzeuge === undefined) parsed.fahrzeuge = [];
  return parsed;
}

// --- Lokaler Modus (localStorage) -- aktiv solange FIREBASE_CONFIGURED
// false ist, siehe oben. ---------------------------------------------------
function loadDataLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return normalizeData(JSON.parse(raw));
  } catch (e) { console.warn("localStorage nicht lesbar:", e); }
  return defaultData();
}
function saveDataLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA));
  } catch (e) {
    alert("Konnte nicht lokal gespeichert werden (localStorage voll oder nicht verfügbar). Bitte über 'Daten' > Export sichern.");
  }
}

// --- Cloud-Modus (Firestore) -- aktiv sobald FIREBASE_CONFIGURED true ist.
// Lädt/legt den gemeinsamen Datensatz an; jeder angemeldete Nutzer sieht
// denselben Stand (Mac, Handy, Kollegen). ----------------------------------
async function loadDataFirestore() {
  const snap = await SHARED_DOC.get();
  if (snap.exists) {
    return normalizeData(snap.data());
  }
  const initial = defaultData();
  await SHARED_DOC.set(initial);
  return initial;
}
function saveDataFirestore() {
  SHARED_DOC.set(DATA).catch(err => {
    console.error("Firestore-Speichern fehlgeschlagen:", err);
    alert("Änderung konnte nicht gespeichert werden (keine Verbindung?). Bitte Internetverbindung prüfen und die letzte Änderung ggf. wiederholen.");
  });
}

// Live-Sync: hält einen offenen Tab automatisch aktuell, wenn auf einem
// ANDEREN Gerät (Handy, Mac, Kollege) etwas geändert wird -- ohne das
// müsste man manuell neu laden, um den aktuellen Stand zu sehen.
let firestoreUnsubscribe = null;
function startFirestoreListener() {
  if (firestoreUnsubscribe) firestoreUnsubscribe();
  firestoreUnsubscribe = SHARED_DOC.onSnapshot((snap) => {
    if (!snap.exists) return; // wird nur beim allerersten Login angelegt
    // hasPendingWrites = true heißt: das ist die lokale Bestätigung unserer
    // EIGENEN gerade erst gesendeten Änderung -- die haben wir schon
    // gerendert (siehe "saveData(); renderAll();"-Muster), kein erneutes
    // renderAll() nötig. Nur auf wirklich von außen kommende Änderungen
    // reagieren.
    if (snap.metadata.hasPendingWrites) return;
    DATA = normalizeData(snap.data());
    renderAll();
  }, (err) => {
    console.error("Firestore-Live-Sync fehlgeschlagen:", err);
  });
}
function stopFirestoreListener() {
  if (firestoreUnsubscribe) { firestoreUnsubscribe(); firestoreUnsubscribe = null; }
}

// --- Einheitliche Schnittstelle, die der Rest der App (15 bestehende
// "saveData(); renderAll();"-Aufrufe) unverändert weiter benutzt. ---------
async function loadData() {
  return FIREBASE_CONFIGURED ? await loadDataFirestore() : loadDataLocal();
}
function saveData() {
  if (FIREBASE_CONFIGURED) saveDataFirestore(); else saveDataLocal();
}

function fmtEUR(n) {
  return (n == null ? 0 : n).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
}
function fmtDate(d) {
  if (!d) return "–";
  const [y, m, day] = d.split("-");
  return `${day}.${m}.${y}`;
}
function fmtPct(n) {
  return (n == null ? 0 : n).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " %";
}

function getObjekt(id) { return DATA.objekte.find(o => o.id === id); }
function getEinheit(objektId, einheitId) {
  const o = getObjekt(objektId);
  return o ? o.einheiten.find(e => e.id === einheitId) : null;
}
function objektBildSrc(o) {
  return o.bildDataUrl || o.bildUrl || null;
}

// Großes Foto-Banner im Immobilienportal-Stil (Adresse + Meta als Overlay-Text)
function listingHero(o, metaText) {
  const bild = objektBildSrc(o);
  if (bild) {
    return `<div class="listing-hero">

      <div class="overlay"></div>

}

// ============================================================
// FINANZIERUNG / TILGUNGSPLAN
// ============================================================
function hatFinanzierung(o) {
  return o.darlehenssumme && o.zinssatz != null && o.tilgungssatz != null && o.kreditstart;
}

function monatlicheRate(o) {
  if (!hatFinanzierung(o)) return 0;
  return o.darlehenssumme * (o.zinssatz + o.tilgungssatz) / 100 / 12;
}

// Monatliche Amortisationstabelle vom Kreditstart bis zu einem Zieldatum (inkl.)
function amortisationMonatlich(o, bisDatum) {
  if (!hatFinanzierung(o)) return [];
  const rate = monatlicheRate(o);
  let restschuld = o.darlehenssumme;
  const start = new Date(o.kreditstart + "T00:00:00");
  const end = new Date(bisDatum + "T00:00:00");
  const rows = [];
  let cursor = new Date(start);
  while (cursor <= end && restschuld > 0.01) {
    const zinsanteil = restschuld * (o.zinssatz / 100) / 12;
    let tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil > restschuld) tilgungsanteil = restschuld;
    restschuld = Math.max(0, restschuld - tilgungsanteil);
    rows.push({
      jahr: cursor.getFullYear(),
      monat: cursor.getMonth() + 1,
      zinsanteil, tilgungsanteil, restschuld
    });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return rows;
}

function heuteISO() {
  return new Date().toISOString().slice(0, 10);
}

// Sammelt alles, was in absehbarer Zeit fällig wird oder schon überfällig
// ist -- TÜV, befristete Mietverträge, offene Kautions-Resttermine,
// auslaufende Zinsbindung. Jedes hat einen eigenen Vorlauf-Horizont
// (TÜV z.B. 60 Tage, Zinsbindung 365 Tage -- eine Anschlussfinanzierung
// braucht mehr Vorlauf als ein TÜV-Termin). Felder, die leer/nicht
// gesetzt sind, tauchen einfach nicht auf -- keine Warnung ohne Datum.
function getFaelligkeiten() {
  const heute = new Date(heuteISO() + "T00:00:00");
  const tage = (datum) => Math.round((datum - heute) / 86400000);
  const liste = [];

  for (const f of (DATA.fahrzeuge || [])) {
    if (f.status !== "Bestand" || !f.tuevBis) continue;
    const [jahr, monat] = f.tuevBis.split("-").map(Number);
    if (!jahr || !monat) continue;
    const faellig = new Date(jahr, monat, 0); // letzter Tag des TÜV-Monats
    const d = tage(faellig);
    if (d <= 60) liste.push({ typ: "TÜV", text: `${f.marke} ${f.modell}`.trim(), datum: faellig, tage: d, horizon: 60 });
  }

  for (const o of DATA.objekte) {
    if (o.zinsbindungEnde) {
      const faellig = new Date(o.zinsbindungEnde + "T00:00:00");
      const d = tage(faellig);
      if (d <= 365) liste.push({ typ: "Zinsbindung", text: o.adresse, datum: faellig, tage: d, horizon: 365 });
    }
    for (const e of o.einheiten) {
      if (e.mietende) {
        const faellig = new Date(e.mietende + "T00:00:00");
        const d = tage(faellig);
        if (d <= 90) liste.push({ typ: "Mietende", text: `${o.adresse} — ${e.name}${e.mieterName ? " (" + e.mieterName + ")" : ""}`, datum: faellig, tage: d, horizon: 90 });
      }
      if (e.kautionRestfaelligAm && Number(e.kautionBezahlt || 0) < Number(e.kautionSoll || 0)) {
        const faellig = new Date(e.kautionRestfaelligAm + "T00:00:00");
        const d = tage(faellig);
        if (d <= 30) liste.push({ typ: "Kaution-Rest", text: `${o.adresse} — ${e.name}${e.mieterName ? " (" + e.mieterName + ")" : ""}`, datum: faellig, tage: d, horizon: 30 });
      }
    }
  }

  liste.sort((a, b) => a.datum - b.datum);
  return liste;
}

function faelligkeitenWidget() {
  const liste = getFaelligkeiten();
  if (!liste.length) {
    return `<div class="card"><h2>⏰ Fällig bald</h2><div class="note" style="margin-top:0">Nichts Dringendes in Sicht — TÜV, befristete Mietverträge, Kaution-Resttermine und Zinsbindung sind aktuell alle außerhalb des Vorlaufs.</div></div>`;
  }
  const rows = liste.map(x => {
    const dringlichkeit = x.tage < 0 ? "red" : x.tage <= 14 ? "red" : x.tage <= 30 ? "gold" : "muted";
    const wann = x.tage < 0 ? `${Math.abs(x.tage)} Tage überfällig` : x.tage === 0 ? "heute" : `in ${x.tage} Tagen`;
    return `<tr>
      <td><span class="tag ${dringlichkeit}">${x.typ}</span></td>
      <td>${x.text}</td>
      <td>${fmtDate(x.datum.toISOString().slice(0,10))}</td>
      <td class="num">${wann}</td>
    </tr>`;
  }).join("");
  return `<div class="card">
    <h2>⏰ Fällig bald</h2>
    <table>
      <tr><th>Typ</th><th>Was</th><th>Termin</th><th class="num">Wann</th></tr>
      ${rows}
    </table>
  </div>`;
}

function finanzKennzahlen(o) {
  if (!hatFinanzierung(o)) return null;
  const rows = amortisationMonatlich(o, heuteISO());
  const restschuldAktuell = rows.length ? rows[rows.length - 1].restschuld : o.darlehenssumme;
  const getilgtGesamt = o.darlehenssumme - restschuldAktuell;
  const letzte = rows[rows.length - 1] || { zinsanteil: 0, tilgungsanteil: 0 };
  return {
    rate: monatlicheRate(o),
    restschuldAktuell,
    getilgtGesamt,
    fortschrittProzent: o.darlehenssumme ? (getilgtGesamt / o.darlehenssumme) * 100 : 0,
    aktuellerZinsanteil: letzte.zinsanteil,
    aktuellerTilgungsanteil: letzte.tilgungsanteil,
    monateGezahlt: rows.length
  };
}

function amortisationJaehrlich(o) {
  const rows = amortisationMonatlich(o, heuteISO());
  const byYear = {};
  rows.forEach(r => {
    if (!byYear[r.jahr]) byYear[r.jahr] = { jahr: r.jahr, zinsen: 0, tilgung: 0, restschuldEnde: r.restschuld };
    byYear[r.jahr].zinsen += r.zinsanteil;
    byYear[r.jahr].tilgung += r.tilgungsanteil;
    byYear[r.jahr].restschuldEnde = r.restschuld;
  });
  return Object.values(byYear).sort((a, b) => a.jahr - b.jahr);
}

// ============================================================
// DARLEHENSRECHNER (Tab) — freies Planungstool, unabhängig von Objekten,
// nichts wird gespeichert (bewusst ein Scratch-Tool).
// ============================================================
let rechnerInitialized = false;
let rechnerModus = "satz"; // "satz" = Tilgungssatz eingeben, "rate" = feste Monatsrate eingeben
let rechnerSondertilgungen = []; // { id, datum, betrag } — nur im Speicher, kein DATA/localStorage

// Reine Rechenfunktion, unabhängig vom DOM — testbar ohne Browser.
function rechnerBerechnen(input) {
  const errors = [];
  const darlehenssumme = Number(input.darlehenssumme) || 0;
  const zinssatz = input.zinssatz != null ? Number(input.zinssatz) : null;

  if (!darlehenssumme || darlehenssumme <= 0) errors.push("Darlehenssumme fehlt oder ist 0.");
  if (zinssatz == null || zinssatz < 0) errors.push("Zinssatz fehlt.");
  if (!input.kreditstart) errors.push("Kreditstart fehlt.");
  if (errors.length) return { errors, warnings: [] };

  let rate, tilgungssatzAnfang;
  if (input.modus === "rate") {
    const monatsrate = Number(input.monatsrate) || 0;
    if (monatsrate <= 0) return { errors: ["Monatliche Rate fehlt."], warnings: [] };
    rate = monatsrate;
    tilgungssatzAnfang = (rate * 12 / darlehenssumme) * 100 - zinssatz;
  } else if (input.modus === "laufzeit") {
    const laufzeitJahre = Number(input.laufzeitJahre) || 0;
    const nMonate = Math.round(laufzeitJahre * 12);
    if (nMonate <= 0) return { errors: ["Gewünschte Laufzeit fehlt."], warnings: [] };
    const iMonat = zinssatz / 100 / 12;
    // Annuitätenformel: welche konstante Monatsrate tilgt die Darlehenssumme in genau n Monaten voll ab?
    rate = iMonat > 0
      ? darlehenssumme * iMonat / (1 - Math.pow(1 + iMonat, -nMonate))
      : darlehenssumme / nMonate; // Sonderfall 0 % Zins: lineare Tilgung
    tilgungssatzAnfang = (rate * 12 / darlehenssumme) * 100 - zinssatz;
  } else {
    const tilgungssatz = Number(input.tilgungssatz) || 0;
    if (tilgungssatz <= 0) return { errors: ["Tilgungssatz fehlt."], warnings: [] };
    tilgungssatzAnfang = tilgungssatz;
    rate = darlehenssumme * (zinssatz + tilgungssatz) / 100 / 12;
  }

  const zinsanteilStart = darlehenssumme * (zinssatz / 100) / 12;
  if (rate <= zinsanteilStart) {
    return { errors: [`Die Monatsrate (${fmtEUR(rate)}) deckt nicht einmal die Zinsen (${fmtEUR(zinsanteilStart)}) — die Restschuld würde nie sinken. Tilgungssatz bzw. Rate erhöhen.`], warnings: [] };
  }

  // Einmalige Sondertilgungen nach Monats-Key ("YYYY-M") vorsortieren
  const einmaligeByKey = {};
  (input.sondertilgungenEinmalig || []).forEach(s => {
    if (!s.datum || !s.betrag) return;
    const d = new Date(s.datum + "T00:00:00");
    const key = d.getFullYear() + "-" + (d.getMonth() + 1);
    einmaligeByKey[key] = (einmaligeByKey[key] || 0) + Number(s.betrag);
  });

  const sondertilgungJaehrlich = Number(input.sondertilgungJaehrlich) || 0;
  const grenzeProzent = input.sondertilgungsGrenzeProzent != null ? Number(input.sondertilgungsGrenzeProzent) : null;
  const grenzeBetrag = grenzeProzent != null ? darlehenssumme * (grenzeProzent / 100) : null;

  const zinsbindungMonate = input.zinsbindungJahre ? Math.round(Number(input.zinsbindungJahre) * 12) : null;
  const maxMonths = 50 * 12; // Sicherheitsgrenze gegen Endlosschleifen bei unsinnigen Eingaben

  let restschuld = darlehenssumme;
  const rows = [];
  let cursor = new Date(input.kreditstart + "T00:00:00");
  let monat = 0;
  let gesamtzinsen = 0;
  let gesamtsondertilgung = 0;
  let jahresSonder = 0;
  let jahresBegin = cursor.getFullYear();
  const warnings = [];
  let hitMaxMonths = false;
  let gestopptDurchZinsbindung = false;

  while (restschuld > 0.01) {
    if (zinsbindungMonate != null && monat >= zinsbindungMonate) { gestopptDurchZinsbindung = true; break; }
    if (monat >= maxMonths) { hitMaxMonths = true; break; }

    const jahr = cursor.getFullYear();
    if (jahr !== jahresBegin) {
      if (grenzeBetrag != null && jahresSonder > grenzeBetrag + 0.01) {
        warnings.push(`Sondertilgung ${jahresBegin}: ${fmtEUR(jahresSonder)} überschreitet die Grenze von ${fmtEUR(grenzeBetrag)} (${grenzeProzent}% / Jahr).`);
      }
      jahresBegin = jahr;
      jahresSonder = 0;
    }

    const zinsanteil = restschuld * (zinssatz / 100) / 12;
    let tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil > restschuld) tilgungsanteil = restschuld;
    restschuld -= tilgungsanteil;
    gesamtzinsen += zinsanteil;

    let sonder = 0;
    const key = jahr + "-" + (cursor.getMonth() + 1);
    if (einmaligeByKey[key]) sonder += einmaligeByKey[key];
    if (sondertilgungJaehrlich && cursor.getMonth() === 11) sonder += sondertilgungJaehrlich;
    if (sonder > restschuld) sonder = restschuld;
    restschuld = Math.max(0, restschuld - sonder);
    gesamtsondertilgung += sonder;
    jahresSonder += sonder;

    rows.push({ jahr, monat: cursor.getMonth() + 1, zinsanteil, tilgungsanteil, sonder, restschuld });
    if (restschuld <= 0.01) restschuld = 0;

    cursor.setMonth(cursor.getMonth() + 1);
    monat++;
  }
  // Grenzprüfung fürs letzte (ggf. unvollständige) Jahr nachholen
  if (grenzeBetrag != null && jahresSonder > grenzeBetrag + 0.01) {
    warnings.push(`Sondertilgung ${jahresBegin}: ${fmtEUR(jahresSonder)} überschreitet die Grenze von ${fmtEUR(grenzeBetrag)} (${grenzeProzent}% / Jahr).`);
  }
  if (hitMaxMonths) {
    warnings.push("Nach 50 Jahren ist die Restschuld immer noch nicht auf 0 — Eingaben prüfen (Rate evtl. zu niedrig).");
  }

  const restschuldEnde = rows.length ? rows[rows.length - 1].restschuld : darlehenssumme;
  const vollstaendigGetilgt = restschuldEnde <= 0.01;

  const byYear = {};
  rows.forEach(r => {
    if (!byYear[r.jahr]) byYear[r.jahr] = { jahr: r.jahr, zinsen: 0, tilgung: 0, sonder: 0, restschuldEnde: r.restschuld };
    byYear[r.jahr].zinsen += r.zinsanteil;
    byYear[r.jahr].tilgung += r.tilgungsanteil;
    byYear[r.jahr].sonder += r.sonder;
    byYear[r.jahr].restschuldEnde = r.restschuld;
  });

  return {
    errors: [],
    warnings,
    rate,
    tilgungssatzAnfang,
    zinsanteilStart: rows[0] ? rows[0].zinsanteil : zinsanteilStart,
    tilgungsanteilStart: rows[0] ? rows[0].tilgungsanteil : (rate - zinsanteilStart),
    monateGerechnet: rows.length,
    restschuldEnde,
    vollstaendigGetilgt,
    gestopptDurchZinsbindung,
    gesamtzinsen,
    gesamtsondertilgung,
    fortschrittProzent: darlehenssumme ? ((darlehenssumme - restschuldEnde) / darlehenssumme) * 100 : 0,
    jahresRows: Object.values(byYear).sort((a, b) => a.jahr - b.jahr)
  };
}

function rechnerAktuelleEingaben() {
  return {
    darlehenssumme: Number(document.getElementById("r-darlehenssumme").value) || 0,
    zinssatz: document.getElementById("r-zinssatz").value !== "" ? Number(document.getElementById("r-zinssatz").value) : null,
    kreditstart: document.getElementById("r-kreditstart").value,
    zinsbindungJahre: document.getElementById("r-zinsbindung").value ? Number(document.getElementById("r-zinsbindung").value) : null,
    modus: rechnerModus,
    tilgungssatz: Number(document.getElementById("r-tilgungssatz").value) || 0,
    monatsrate: Number(document.getElementById("r-rate").value) || 0,
    laufzeitJahre: Number(document.getElementById("r-laufzeit-wunsch").value) || 0,
    sondertilgungJaehrlich: Number(document.getElementById("r-sonder-jaehrlich").value) || 0,
    sondertilgungsGrenzeProzent: document.getElementById("r-sonder-grenze").value ? Number(document.getElementById("r-sonder-grenze").value) : null,
    sondertilgungenEinmalig: rechnerSondertilgungen
  };
}

function monateAlsJahreText(monate) {
  const jahre = Math.floor(monate / 12);
  const rest = monate % 12;
  if (jahre === 0) return `${rest} Monate`;
  if (rest === 0) return `${jahre} Jahre`;
  return `${jahre} Jahre, ${rest} Monate`;
}

function updateRechnerErgebnis() {
  const el = document.getElementById("rechner-ergebnis");
  if (!el) return;
  const input = rechnerAktuelleEingaben();
  const r = rechnerBerechnen(input);

  if (r.errors.length) {
    el.innerHTML = `<div class="card"><div class="empty">${r.errors.join("<br>")}</div></div>`;
    return;
  }

  const heroLabel = r.gestopptDurchZinsbindung ? `Restschuld nach ${input.zinsbindungJahre} Jahren Zinsbindung` : "Restschuld bei Volltilgung";
  const heroValue = r.gestopptDurchZinsbindung ? r.restschuldEnde : 0;
  const ringLabel = r.gestopptDurchZinsbindung ? "Nach Zinsbindung<br>getilgt" : "Bis Volltilgung<br>getilgt";

  const warnHtml = r.warnings.length
    ? `<div class="warn-note"><b>Hinweis:</b><br>${r.warnings.join("<br>")}</div>`
    : "";

  const anschlussHtml = r.gestopptDurchZinsbindung
    ? `<div class="formula-note">Für eine Anschlussfinanzierung die Restschuld <b>${fmtEUR(r.restschuldEnde)}</b> einfach oben als neue Darlehenssumme eintragen und mit dem dann erwarteten Zins neu rechnen.</div>`
    : "";

  el.innerHTML = `
    <div class="card">
      <div class="fin-top">
        ${renderRing(r.fortschrittProzent, ringLabel)}
        <div style="flex:1; min-width:260px">
          <div class="grid-kpi" style="margin-bottom:0">
            <div class="kpi hero"><div class="label">${heroLabel}</div><div class="value">${fmtEUR(heroValue)}</div></div>
            <div class="kpi"><div class="label">Monatliche Rate</div><div class="value">${fmtEUR(r.rate)}</div></div>
            <div class="kpi"><div class="label">Zinsanteil zu Beginn</div><div class="value">${fmtEUR(r.zinsanteilStart)}</div></div>
            <div class="kpi"><div class="label">Tilgungsanteil zu Beginn</div><div class="value">${fmtEUR(r.tilgungsanteilStart)}</div></div>
          </div>
        </div>
      </div>
      <div class="grid-kpi">
        ${input.modus !== "satz" ? `<div class="kpi"><div class="label">Effektiver Tilgungssatz zu Beginn</div><div class="value">${r.tilgungssatzAnfang.toFixed(2)} %</div></div>` : ""}
        <div class="kpi"><div class="label">${r.gestopptDurchZinsbindung ? "Dauer der Zinsbindung" : "Gesamtlaufzeit bis Volltilgung"}</div><div class="value">${monateAlsJahreText(r.monateGerechnet)}</div></div>
        <div class="kpi"><div class="label">Gesamtzinskosten (berechneter Zeitraum)</div><div class="value red">${fmtEUR(r.gesamtzinsen)}</div></div>
        <div class="kpi"><div class="label">Sondertilgungen gesamt</div><div class="value green">${fmtEUR(r.gesamtsondertilgung)}</div></div>
      </div>
      ${warnHtml}
      ${anschlussHtml}
      <h3 style="margin-top:16px">Tilgungsplan nach Jahren</h3>
      <table>
        <tr><th>Jahr</th><th class="num">Zinsen</th><th class="num">Reguläre Tilgung</th><th class="num">Sondertilgung</th><th class="num">Restschuld Jahresende</th></tr>
        ${r.jahresRows.map(y => `<tr><td>${y.jahr}</td><td class="num">${fmtEUR(y.zinsen)}</td><td class="num">${fmtEUR(y.tilgung)}</td><td class="num">${fmtEUR(y.sonder)}</td><td class="num">${fmtEUR(y.restschuldEnde)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">Keine Berechnung möglich.</td></tr>`}
      </table>
    </div>`;
}

function setRechnerModus(modus) {
  rechnerModus = modus;
  document.querySelectorAll("#rechner-modus-toggle .toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.modus === modus));
  document.getElementById("r-feld-tilgungssatz").style.display = modus === "satz" ? "flex" : "none";
  document.getElementById("r-feld-rate").style.display = modus === "rate" ? "flex" : "none";
  document.getElementById("r-feld-laufzeit").style.display = modus === "laufzeit" ? "flex" : "none";
  updateRechnerErgebnis();
}

function addSondertilgung(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const datum = f.get("datum");
  const betrag = Number(f.get("betrag"));
  if (!datum || !betrag) return;
  rechnerSondertilgungen.push({ id: uid(), datum, betrag });
  ev.target.reset();
  renderSondertilgungenListe();
  updateRechnerErgebnis();
}

function removeSondertilgung(id) {
  rechnerSondertilgungen = rechnerSondertilgungen.filter(s => s.id !== id);
  renderSondertilgungenListe();
  updateRechnerErgebnis();
}

function renderSondertilgungenListe() {
  const el = document.getElementById("rechner-sondertilgungen-liste");
  if (!el) return;
  if (rechnerSondertilgungen.length === 0) { el.innerHTML = ""; return; }
  const sorted = [...rechnerSondertilgungen].sort((a, b) => (a.datum || "").localeCompare(b.datum || ""));
  el.innerHTML = `<tr><th>Datum</th><th class="num">Betrag</th><th></th></tr>` +
    sorted.map(s => `<tr><td>${fmtDate(s.datum)}</td><td class="num">${fmtEUR(s.betrag)}</td><td><button class="danger" type="button" onclick="removeSondertilgung('${s.id}')">löschen</button></td></tr>`).join("");
}

// ============================================================
// BALLONKREDITRECHNER (innerhalb des Darlehensrechner-Tabs) — für Autokredite
// mit Drei-Wege-Finanzierung: niedrige Monatsraten + große Schlussrate am Ende.
// ============================================================
let ballonModus = "schlussrate"; // "schlussrate" = Schlussrate vorgeben, "rate" = Monatsrate vorgeben

// Reine Rechenfunktion, unabhängig vom DOM — testbar ohne Browser.
function ballonBerechnen(input) {
  const errors = [];
  const kaufpreis = Number(input.kaufpreis) || 0;
  const anzahlung = Number(input.anzahlung) || 0;
  const zinssatz = input.zinssatz != null ? Number(input.zinssatz) : null;
  const n = Math.round(Number(input.laufzeitMonate) || 0);
  const darlehensbetrag = kaufpreis - anzahlung;

  if (!kaufpreis || kaufpreis <= 0) errors.push("Kaufpreis fehlt oder ist 0.");
  if (anzahlung < 0) errors.push("Anzahlung darf nicht negativ sein.");
  if (kaufpreis > 0 && darlehensbetrag <= 0) errors.push("Anzahlung ist größer oder gleich dem Kaufpreis — kein Darlehen nötig.");
  if (zinssatz == null || zinssatz < 0) errors.push("Zinssatz fehlt.");
  if (n <= 0) errors.push("Laufzeit fehlt.");
  if (errors.length) return { errors, warnings: [] };

  const i = zinssatz / 100 / 12;
  const abzinsfaktorN = i > 0 ? Math.pow(1 + i, -n) : 1;
  const annuitaetenfaktor = i > 0 ? (1 - abzinsfaktorN) / i : n;

  let rate;
  if (input.modus === "rate") {
    rate = Number(input.monatsrate) || 0;
    if (rate <= 0) return { errors: ["Monatliche Rate fehlt."], warnings: [] };
  } else {
    const schlussrateVorgabe = Number(input.schlussrate) || 0;
    if (schlussrateVorgabe < 0) return { errors: ["Schlussrate fehlt."], warnings: [] };
    rate = i > 0
      ? (darlehensbetrag - schlussrateVorgabe * abzinsfaktorN) / annuitaetenfaktor
      : (darlehensbetrag - schlussrateVorgabe) / n;
    if (rate <= 0) {
      return { errors: ["Die Schlussrate ist bei dieser Laufzeit/diesem Zins zu hoch — die resultierende Monatsrate wäre 0 oder negativ. Schlussrate senken oder Laufzeit verlängern."], warnings: [] };
    }
  }

  // n volle Monatsraten tilgen die Restschuld wie bei einem normalen Annuitätendarlehen;
  // was danach übrig bleibt, ist genau die Schlussrate — als separate Zahlung zusätzlich zur letzten Monatsrate fällig.
  let restschuld = darlehensbetrag;
  const rows = [];
  let gesamtzinsen = 0;
  const warnings = [];

  for (let m = 1; m <= n; m++) {
    const zinsanteil = restschuld * i;
    const tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil < 0) {
      warnings.push(`Monat ${m}: Die Rate deckt die Zinsen nicht — die Restschuld steigt in diesem Monat statt zu sinken.`);
    }
    restschuld -= tilgungsanteil;
    gesamtzinsen += zinsanteil;
    rows.push({ monat: m, zahlung: rate, zinsanteil, tilgungsanteil, restschuld, istSchlussrate: false });
  }

  const schlussrateIst = Math.max(0, restschuld);
  rows.push({ monat: n, zahlung: schlussrateIst, zinsanteil: 0, tilgungsanteil: schlussrateIst, restschuld: 0, istSchlussrate: true });

  const gesamtkostenRaten = rate * n + schlussrateIst;

  return {
    errors: [],
    warnings,
    darlehensbetrag,
    rate,
    schlussrateIst,
    gesamtzinsen,
    gesamtkosten: gesamtkostenRaten + anzahlung,
    rows
  };
}

// ============================================================
// WERTERMITTLUNG: Marktwert (Ertragswertverfahren) & Beleihungswert (BelWertV-nah)
// ============================================================

// Jahresrohertrag wird live aus den Einheiten abgeleitet (Soll-Kaltmiete × 12) —
// keine Zahl doppelt pflegen, derselbe Wert wie auf dem Dashboard.
function rohertragJahr(o) {
  return o.einheiten.reduce((s, e) => s + Number(e.kaltmiete || 0), 0) * 12;
}

function vervielfaeltiger(zinsProzent, jahre) {
  const i = zinsProzent / 100;
  if (i <= 0 || jahre <= 0) return 0;
  return (1 - Math.pow(1 + i, -jahre)) / i;
}

function berechneMarktwert(o) {
  const rohertrag = rohertragJahr(o);
  const bodenwert = o.grundstueck * o.bodenrichtwert;
  const verwaltung = 300 * o.einheiten.length;
  const instandhaltung = 12 * o.wohnflaeche;
  const mietausfall = 0.02 * rohertrag;
  const bewirtschaftung = verwaltung + instandhaltung + mietausfall;
  const reinertrag = rohertrag - bewirtschaftung;
  const bodenwertverzinsung = bodenwert * (o.liegenschaftszins / 100);
  const gebaeudereinertrag = reinertrag - bodenwertverzinsung;
  const verv = vervielfaeltiger(o.liegenschaftszins, o.restnutzungsdauer);
  const gebaeudeertragswert = gebaeudereinertrag * verv;
  const marktwert = bodenwert + gebaeudeertragswert;
  return { rohertrag, bodenwert, verwaltung, instandhaltung, mietausfall, bewirtschaftung, reinertrag, bodenwertverzinsung, gebaeudereinertrag, verv, gebaeudeertragswert, marktwert };
}

function berechneBeleihungswert(o) {
  const rohertrag = rohertragJahr(o);
  const bodenwert = o.grundstueck * o.bodenrichtwert;
  const nachhaltigeMiete = rohertrag * (o.nachhaltigeMieteProzent / 100);
  const belwertBewirtschaftung = nachhaltigeMiete * (o.belwertBewirtschaftungProzent / 100);
  const nachhaltigerReinertrag = nachhaltigeMiete - belwertBewirtschaftung;
  const belwertZins = o.liegenschaftszins + o.belwertZinsZuschlag;
  const bodenwertverzinsung = bodenwert * (belwertZins / 100);
  const gebaeudereinertrag = nachhaltigerReinertrag - bodenwertverzinsung;
  const verv = vervielfaeltiger(belwertZins, o.restnutzungsdauer);
  const gebaeudeertragswert = gebaeudereinertrag * verv;
  const rohwert = bodenwert + gebaeudeertragswert;
  const abschlag = rohwert * (o.belwertSicherheitsabschlagProzent / 100);
  const beleihungswert = rohwert - abschlag;
  return { rohertrag, bodenwert, nachhaltigeMiete, belwertBewirtschaftung, nachhaltigerReinertrag, belwertZins, bodenwertverzinsung, gebaeudereinertrag, verv, gebaeudeertragswert, rohwert, abschlag, beleihungswert };
}

// Kleiner SVG-Fortschrittsring (z.B. für Tilgungsfortschritt)
function renderRing(percent, labelHtml) {
  const p = Math.max(0, Math.min(100, percent));
  const r = 42, c = 2 * Math.PI * r;
  const offset = c * (1 - p / 100);
  return `
    <div class="ring-wrap">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="#ebebeb" stroke-width="8"></circle>
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="url(#ringGrad)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${offset.toFixed(2)}"
          transform="rotate(-90 55 55)" style="transition: stroke-dashoffset .5s ease"></circle>
        <defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ff385c"></stop>
            <stop offset="100%" stop-color="#d70466"></stop>
          </linearGradient>
        </defs>
        <text x="55" y="60" text-anchor="middle" class="ring-pct">${p.toFixed(1)}%</text>
      </svg>
      <div class="ring-label">${labelHtml}</div>
    </div>`;
}

function renderDashboard() {
  const el = document.getElementById("view-dashboard");
  if (DATA.objekte.length === 0) {
    el.innerHTML = `<div class="card"><div class="empty">Noch keine Objekte angelegt. Leg unter "🏗️ Objekte" dein erstes Objekt an.</div></div>`;
    return;
  }

  let html = "";
  let gesamtEinnahmen = 0, gesamtKostenUmlage = 0, gesamtKostenSelbst = 0, gesamtVermoegen = 0, gesamtUeberschussVorSteuern = 0;

  for (const o of DATA.objekte) {
    const einnahmen = DATA.mieteinnahmen
      .filter(m => m.objektId === o.id)
      .reduce((s, m) => s + Number(m.betrag), 0);
    const kostenObjekt = DATA.kosten.filter(k => k.objektId === o.id);
    const kostenUmlage = kostenObjekt.filter(k => k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
    const kostenSelbst = kostenObjekt.filter(k => !k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
    const sollMieteMonat = o.einheiten.reduce((s, e) => s + Number(e.kaltmiete || 0), 0);
    const mietueberschuss = einnahmen - kostenSelbst;

    const fk = finanzKennzahlen(o);
    const vermoegen = (fk ? fk.getilgtGesamt : 0) + mietueberschuss;
    const monatlicheRateObjekt = fk ? fk.rate : 0;
    const ueberschussVorSteuern = sollMieteMonat - monatlicheRateObjekt;

    gesamtEinnahmen += einnahmen;
    gesamtKostenUmlage += kostenUmlage;
    gesamtKostenSelbst += kostenSelbst;
    gesamtVermoegen += vermoegen;
    gesamtUeberschussVorSteuern += ueberschussVorSteuern;

    const metaText = `${o.einheiten.length} Einheit${o.einheiten.length === 1 ? "" : "en"}${o.typ ? " · " + o.typ : ""}${o.baujahr ? " · Baujahr " + o.baujahr : ""}`;

        </div>
      </div>`;
  }

  html = `

      <div class="hero-bloom"></div>
      <div class="hero-text">
        <div class="hero-title">Alles im Blick, Devran</div>

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Alle Daten liegen in einem einzigen Firestore-Dokument (Limit: 1 MB
// insgesamt, für ALLE Objekte/Kosten/Fahrzeuge/Belege zusammen). Ein Foto
// direkt vom Handy ist oft 2-5 MB -- das würde das Limit sofort sprengen.
// Deshalb: Fotos vor dem Speichern verkleinern (lange Kante max. 1400px,
// JPEG-Qualität 72%) -- aus einem 4 MB-Foto werden so meist nur noch
// 80-200 KB. Für PDFs geht das nicht (lassen sich im Browser nicht
// komprimieren) -- dafür gibt es stattdessen eine harte Größengrenze mit
// klarer Fehlermeldung, siehe assertUploadSize().
function compressImageFile(file, maxDim = 1400, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const MAX_UPLOAD_BYTES = 1.5 * 1024 * 1024; // 1,5 MB roh -- gilt v.a. für PDFs, die nicht komprimiert werden können
function assertUploadSize(file) {
  if (file.size > MAX_UPLOAD_BYTES) {
    throw new Error(
      `Die Datei ist ${(file.size / 1024 / 1024).toFixed(1)} MB groß, erlaubt sind max. 1,5 MB ` +
      `(alle Daten teilen sich einen 1 MB-Speicher in der Cloud). Bei PDFs hilft meist ` +
      `"Drucken -> Als PDF speichern" mit niedrigerer Qualität, bei Fotos reicht normalerweise ` +
      `ein Screenshot/Foto statt der Original-Scan-Datei.`
    );
  }
}

// Datei lesen UND dabei das 1 MB-Gesamtlimit berücksichtigen: Bilder
// werden automatisch verkleinert, PDFs nur bei Überschreitung abgelehnt.
async function readUploadAsDataUrl(file) {
  if (file.type === "application/pdf") {
    assertUploadSize(file);
    return await readFileAsDataUrl(file);
  }
  if (file.type.startsWith("image/")) {
    return await compressImageFile(file);
  }
  // unbekannter Dateityp -- im Zweifel trotzdem versuchen, aber Größe prüfen
  assertUploadSize(file);
  return await readFileAsDataUrl(file);
}

// Kleines Status-Tag neben dem Mieternamen in der Einheiten-Tabelle:
// grün = Kaution komplett bezahlt, gelb = teilweise, rot = noch nichts
// bezahlt -- nur sichtbar, wenn überhaupt eine Soll-Kaution hinterlegt ist.
function kautionBadge(e) {
  if (!e.kautionSoll) return "";
  const bezahlt = Number(e.kautionBezahlt || 0);
  const soll = Number(e.kautionSoll);
  if (bezahlt >= soll) return ` <span class="tag green">Kaution voll bezahlt</span>`;
  if (bezahlt > 0) return ` <span class="tag gold">Kaution ${fmtEUR(bezahlt)} / ${fmtEUR(soll)}</span>`;
  return ` <span class="tag red">Kaution offen</span>`;
}

async function updateEinheitMieter(ev, objektId, einheitId) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const o = getObjekt(objektId);
  const e = o.einheiten.find(x => x.id === einheitId);
  if (!e) return;
  e.mieterName = f.get("mieterName") || "";
  e.mieterKontakt = f.get("mieterKontakt") || "";
  e.mietbeginn = f.get("mietbeginn") || "";
  e.mietende = f.get("mietende") || "";
  e.kautionSoll = f.get("kautionSoll") ? Number(f.get("kautionSoll")) : null;
  e.kautionBezahlt = f.get("kautionBezahlt") ? Number(f.get("kautionBezahlt")) : null;
  e.kautionRestfaelligAm = f.get("kautionRestfaelligAm") || "";

  const vertrag = f.get("mietvertrag");
  if (vertrag && vertrag.size > 0) {
    try {
      e.mietvertragDataUrl = await readUploadAsDataUrl(vertrag);
      e.mietvertragName = vertrag.name;
    } catch (err) {
      alert("Mietvertrag konnte nicht gespeichert werden: " + err.message);
      return;
    }
  }
  saveData(); renderAll();
}

        <div class="note">${fk.fortschrittProzent.toFixed(2)} % des Darlehens getilgt (${fk.monateGezahlt} Monate seit Kreditstart ${fmtDate(o.kreditstart)})</div>

          <b>Vermögensaufbau bisher: ${fmtEUR(vermoegen)}</b><br>
          = Bereits getilgt (${fmtEUR(fk.getilgtGesamt)}) + Mietüberschuss (${fmtEUR(mietueberschuss)})<br>
          Mietüberschuss = erfasste Mieteinnahmen (${fmtEUR(einnahmen)}) − nicht umlagefähige Kosten (${fmtEUR(kostenSelbst)})<br>
          Zinsen sind hier bewusst nicht nochmal abgezogen — die stecken in der monatlichen Kreditrate, die du vermutlich aus der Miete zahlst. Falls du Zinszahlungen zusätzlich manuell als "Kreditzinsen"-Kosten einträgst, wird das in der Mietüberschuss-Rechnung berücksichtigt.
        </div>

        <h3 style="margin-top:16px">Tilgungsplan nach Jahren (bis heute)</h3>
        <table>
          <tr><th>Jahr</th><th class="num">Gezahlte Zinsen</th><th class="num">Gezahlte Tilgung</th><th class="num">Restschuld Jahresende</th></tr>
          ${amortisationJaehrlich(o).map(r => `<tr><td>${r.jahr}</td><td class="num">${fmtEUR(r.zinsen)}</td><td class="num">${fmtEUR(r.tilgung)}</td><td class="num">${fmtEUR(r.restschuldEnde)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Noch keine volle Zahlungsperiode seit Kreditstart.</td></tr>`}
        </table>
      ` : `<div class="note">Noch keine Finanzierungsdaten hinterlegt — unter "🏗️ Objekte" → "Objektdaten bearbeiten" Darlehenssumme, Zinssatz, Tilgungssatz und Kreditstart eintragen, dann erscheinen hier Restschuld, Tilgungsplan und Vermögensaufbau automatisch.</div>`}
    </div>`;
  }

  el.innerHTML = html;
}

      <h3>💰 Marktwert — Herleitung</h3>
      <table>
        <tr><td>Bodenwert</td><td class="num">${o.grundstueck} m² × ${fmtEUR(o.bodenrichtwert)}/m²</td><td class="num">${fmtEUR(mw.bodenwert)}</td></tr>

        <tr><td>− Bodenwertverzinsung</td><td class="num">× ${fmtPct(o.liegenschaftszins)}</td><td class="num">− ${fmtEUR(mw.bodenwertverzinsung)}</td></tr>

      <h3>🏦 Beleihungswert — Herleitung</h3>
      <table>
        <tr><td>Nachhaltige Miete</td><td class="num">${fmtPct(o.nachhaltigeMieteProzent)} der Marktmiete</td><td class="num">${fmtEUR(bw.nachhaltigeMiete)}</td></tr>
        <tr><td>− Bewirtschaftungspauschale</td><td class="num">${fmtPct(o.belwertBewirtschaftungProzent)}</td><td class="num">− ${fmtEUR(bw.belwertBewirtschaftung)}</td></tr>
        <tr class="subtotal"><td>= Nachhaltiger Reinertrag</td><td></td><td class="num">${fmtEUR(bw.nachhaltigerReinertrag)}</td></tr>

        <tr class="subtotal"><td>= Rohwert (Gebäudeertrag × ${bw.verv.toFixed(2)} + Bodenwert)</td><td></td><td class="num">${fmtEUR(bw.rohwert)}</td></tr>
        <tr><td>− Sicherheitsabschlag</td><td class="num">${fmtPct(o.belwertSicherheitsabschlagProzent)}</td><td class="num">− ${fmtEUR(bw.abschlag)}</td></tr>
        <tr class="subtotal" style="font-size:14.5px"><td><b>= Beleihungswert</b></td><td></td><td class="num"><b>${fmtEUR(bw.beleihungswert)}</b></td></tr>

function renderBuchungen() {
  const el = document.getElementById("view-miete");
  if (DATA.objekte.length === 0) {
    el.innerHTML = `<div class="card"><div class="empty">Erst ein Objekt unter "🏗️ Objekte" anlegen.</div></div>`;
    return;
  }

  const objOptions = DATA.objekte.map(o => `<option value="${o.id}">${o.adresse}</option>`).join("");
  const katOptions = KOSTEN_KATEGORIEN.map(k => `<option value="${k}">${k}</option>`).join("");

  const sumEinnahmen = DATA.mieteinnahmen.reduce((s, m) => s + Number(m.betrag), 0);
  const sumUmlage = DATA.kosten.filter(k => k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
  const sumSelbst = DATA.kosten.filter(k => !k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);

  // Beide Listen zu einer chronologischen Buchungsliste zusammenführen
  const einnahmenRows = DATA.mieteinnahmen.map(m => ({ ...m, _typ: "einnahme" }));
  const kostenRows = DATA.kosten.map(k => ({ ...k, _typ: "kosten" }));
  const alle = [...einnahmenRows, ...kostenRows].sort((a, b) => (b.datum || "").localeCompare(a.datum || ""));

  let rows = alle.map(b => {
    const o = getObjekt(b.objektId);
    if (b._typ === "einnahme") {
      const e = getEinheit(b.objektId, b.einheitId);
      return `<tr>
        <td>${fmtDate(b.datum)}</td>
        <td>${o ? o.adresse : "?"}</td>
        <td><span class="tag green">+ Einnahme</span></td>
        <td>${e ? e.name : "–"}</td>
        <td class="num" style="color:var(--green)">+ ${fmtEUR(b.betrag)}</td>
        <td>${b.notiz || ""}</td>
        <td><button class="danger" onclick="deleteMiete('${b.id}')">löschen</button></td>
      </tr>`;
    }
    return `<tr>
      <td>${fmtDate(b.datum)}</td>
      <td>${o ? o.adresse : "?"}</td>
      <td><span class="tag ${b.umlagefaehig ? 'green' : 'red'}">${b.umlagefaehig ? "umlagefähig" : "eigene Kosten"}</span></td>
      <td>${b.kategorie}</td>
      <td class="num" style="color:var(--red)">− ${fmtEUR(b.betrag)}</td>
      <td>${b.beschreibung || ""}${b.belegDataUrl ? ` <a href="${b.belegDataUrl}" download="${b.belegName || 'beleg'}" title="Beleg ansehen/herunterladen" style="text-decoration:none">📎</a>` : ""}</td>
      <td><button class="danger" onclick="deleteKosten('${b.id}')">löschen</button></td>
    </tr>`;
  }).join("");

  if (!rows) rows = `<tr><td colspan="7" class="empty">Noch keine Buchungen erfasst.</td></tr>`;

  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Mieteinnahmen gesamt</div><div class="value green">${fmtEUR(sumEinnahmen)}</div></div>
      <div class="kpi"><div class="label">Kosten umlagefähig</div><div class="value">${fmtEUR(sumUmlage)}</div></div>
      <div class="kpi"><div class="label">Kosten eigene Last</div><div class="value red">${fmtEUR(sumSelbst)}</div></div>
    </div>

    <div class="card">
      <h2>Buchung erfassen</h2>
      <div class="toggle-group" id="buchung-typ-toggle">
        <button type="button" class="toggle-btn active" data-typ="einnahme" onclick="setBuchungTyp('einnahme')">💶 Einnahme</button>
        <button type="button" class="toggle-btn" data-typ="kosten" onclick="setBuchungTyp('kosten')">🧾 Kosten</button>
      </div>

      <form class="inline" id="form-einnahme" onsubmit="addMiete(event)">
        <div class="field"><label>Datum</label><input name="datum" type="date" required></div>
        <div class="field"><label>Objekt</label><select name="objektId" required onchange="updateEinheitOptions(this)">${objOptions}</select></div>
        <div class="field"><label>Einheit</label><select name="einheitId" id="miete-einheit-select"></select></div>
        <div class="field"><label>Betrag (€)</label><input name="betrag" type="number" step="0.01" required></div>
        <div class="field wide"><label>Notiz</label><input name="notiz" placeholder="z.B. Kaltmiete Oktober"></div>
        <button class="primary" type="submit">+ Eintragen</button>
      </form>

      <form class="inline" id="form-kosten" onsubmit="addKosten(event)" style="display:none">
        <div class="field"><label>Datum</label><input name="datum" type="date" required></div>
        <div class="field"><label>Objekt</label><select name="objektId" required>${objOptions}</select></div>
        <div class="field"><label>Kategorie</label><select name="kategorie" onchange="suggestUmlage(this)">${katOptions}</select></div>
        <div class="field"><label>Betrag (€)</label><input name="betrag" type="number" step="0.01" required></div>
        <div class="field checkbox"><input type="checkbox" name="umlagefaehig" id="umlage-checkbox"><label for="umlage-checkbox">umlagefähig</label></div>
        <div class="field wide"><label>Beschreibung</label><input name="beschreibung" placeholder="z.B. Rechnungsnummer, Dienstleister"></div>
        <div class="field wide"><label>Beleg (Foto/PDF, optional)</label><input name="beleg" type="file" accept="image/*,application/pdf"></div>
        <button class="primary" type="submit">+ Eintragen</button>
      </form>
      <div class="note">Der Haken bei "umlagefähig" wird je nach Kategorie automatisch vorgeschlagen (BetrKV-Faustregel) — jederzeit selbst umstellbar. Ein angehängter Beleg (Rechnung, Foto) bleibt direkt an der Buchung und wird mit synchronisiert — kein zusätzliches Ablegen nötig.</div>
    </div>

    <div class="card">
      <h2>Alle Buchungen</h2>
      <table>
        <tr><th>Datum</th><th>Objekt</th><th>Typ</th><th>Kategorie/Einheit</th><th class="num">Betrag</th><th>Notiz</th><th></th></tr>
        ${rows}
      </table>
    </div>`;

  const sel = el.querySelector("select[name=objektId]");
  if (sel) updateEinheitOptions(sel);
}

function setBuchungTyp(typ) {
  document.querySelectorAll("#buchung-typ-toggle .toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.typ === typ));
  document.getElementById("form-einnahme").style.display = typ === "einnahme" ? "flex" : "none";
  document.getElementById("form-kosten").style.display = typ === "kosten" ? "flex" : "none";
}

function updateEinheitOptions(selectEl) {
  const o = getObjekt(selectEl.value);
  const target = document.getElementById("miete-einheit-select");
  if (!target) return;
  target.innerHTML = (o ? o.einheiten : []).map(e => `<option value="${e.id}">${e.name}</option>`).join("");
}

function addMiete(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  DATA.mieteinnahmen.push({
    id: uid(),
    objektId: f.get("objektId"),
    einheitId: f.get("einheitId") || null,
    datum: f.get("datum"),
    betrag: Number(f.get("betrag")),
    notiz: f.get("notiz")
  });
  saveData(); renderAll();
}

function deleteMiete(id) {
  DATA.mieteinnahmen = DATA.mieteinnahmen.filter(m => m.id !== id);
  saveData(); renderAll();
}

function suggestUmlage(selectEl) {
  const box = document.getElementById("umlage-checkbox");
  box.checked = !NICHT_UMLAGEFAEHIG_DEFAULT.has(selectEl.value);
}

async function addKosten(ev) {
  ev.preventDefault();
  const form = ev.target;
  const f = new FormData(form);
  const eintrag = {
    id: uid(),
    objektId: f.get("objektId"),
    datum: f.get("datum"),
    kategorie: f.get("kategorie"),
    betrag: Number(f.get("betrag")),
    umlagefaehig: f.get("umlagefaehig") === "on",
    beschreibung: f.get("beschreibung"),
    belegDataUrl: null,
    belegName: null
  };
  const beleg = f.get("beleg");
  if (beleg && beleg.size > 0) {
    try {
      eintrag.belegDataUrl = await readUploadAsDataUrl(beleg);
      eintrag.belegName = beleg.name;
    } catch (e) {
      alert("Beleg konnte nicht gespeichert werden: " + e.message);
      return; // Buchung lieber gar nicht anlegen als ohne Beleg, wenn einer gewollt war
    }
  }
  DATA.kosten.push(eintrag);
  saveData(); renderAll();
}

function deleteKosten(id) {
  DATA.kosten = DATA.kosten.filter(k => k.id !== id);
  saveData(); renderAll();
}

let editingFahrzeugId = null;

function renderAutohandel() {
  const el = document.getElementById("view-autohandel");
  const fz = DATA.fahrzeuge || [];
  const bestand = fz.filter(f => f.status === "Bestand");
  const verkauft = fz.filter(f => f.status === "Verkauft");

  const gewinnRealisiert = verkauft.reduce((s, f) => s + (Number(f.verkaufspreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionIst || 0)), 0);
  const gewinnGeplant = bestand.reduce((s, f) => s + (Number(f.zielpreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionGeplant || 0)), 0);

  const rows = fz.map(f => {
    const gewinn = f.status === "Verkauft"
      ? Number(f.verkaufspreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionIst || 0)

      <td class="num">${fmtEUR(f.status === "Verkauft" ? f.investitionIst : f.investitionGeplant)}</td>
      <td class="num">${f.status === "Verkauft" ? fmtEUR(f.verkaufspreis) : (f.zielpreis ? "Ziel " + fmtEUR(f.zielpreis) : "–")}</td>

        <button class="ghost" onclick="editFahrzeug('${f.id}')">bearbeiten</button>

    </tr>`;

  const edit = editingFahrzeugId ? DATA.fahrzeuge.find(f => f.id === editingFahrzeugId) : null;

  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Im Bestand</div><div class="value">${bestand.length}</div></div>
      <div class="kpi"><div class="label">Verkauft gesamt</div><div class="value">${verkauft.length}</div></div>
      <div class="kpi"><div class="label">Realisierter Gewinn</div><div class="value green">${fmtEUR(gewinnRealisiert)}</div></div>
      <div class="kpi"><div class="label">Geplanter Gewinn (Bestand)</div><div class="value">${fmtEUR(gewinnGeplant)}</div></div>
    </div>

    <div class="card">
      <h2>${edit ? "Fahrzeug bearbeiten" : "Fahrzeug hinzufügen"}</h2>
      <form class="inline" id="form-fahrzeug" onsubmit="submitFahrzeug(event)">
        <div class="field"><label>Marke</label><input name="marke" required value="${edit ? edit.marke : ""}"></div>
        <div class="field"><label>Modell</label><input name="modell" required value="${edit ? edit.modell : ""}"></div>
        <div class="field"><label>Baujahr</label><input name="baujahr" type="number" value="${edit && edit.baujahr ? edit.baujahr : ""}"></div>
        <div class="field"><label>Farbe</label><input name="farbe" value="${edit ? edit.farbe || "" : ""}"></div>
        <div class="field"><label>Kilometerstand</label><input name="km" type="number" value="${edit && edit.km ? edit.km : ""}"></div>
        <div class="field"><label>TÜV bis (Monat)</label><input name="tuevBis" type="month" value="${edit ? edit.tuevBis || "" : ""}"></div>
        <div class="field"><label>Kaufpreis (€)</label><input name="kaufpreis" type="number" step="0.01" value="${edit ? edit.kaufpreis : ""}"></div>
        <div class="field"><label>Investition geplant (€)</label><input name="investitionGeplant" type="number" step="0.01" value="${edit ? edit.investitionGeplant : ""}"></div>
        <div class="field"><label>Zielverkaufspreis (€)</label><input name="zielpreis" type="number" step="0.01" value="${edit && edit.zielpreis ? edit.zielpreis : ""}"></div>
        <div class="field"><label>Geschäftspartner</label><input name="partner" value="${edit ? edit.partner || "" : ""}"></div>
        <div class="field wide"><label>Bild-URL (optional)</label><input name="bildUrl" placeholder="https://..." value="${edit ? edit.bildUrl || "" : ""}"></div>
        <div class="field"><label>oder Bild-Datei hochladen</label><input name="bildDatei" type="file" accept="image/*"></div>
        <div class="field wide"><label>Notizen</label><input name="notizen" value="${edit ? edit.notizen || "" : ""}"></div>
        <button class="primary" type="submit">${edit ? "Speichern" : "+ Hinzufügen"}</button>

    <div class="card">

        <tr><th></th><th>Fahrzeug</th><th class="num">Baujahr</th><th>Farbe</th><th class="num">km</th><th>Status</th><th class="num">Kaufpreis</th><th class="num">Investition</th><th class="num">Ziel/Verkauft</th><th class="num">Gewinn</th><th></th></tr>
        ${rows}
      </table>
    </div>`;

async function submitFahrzeug(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const payload = {
    marke: f.get("marke"),
    modell: f.get("modell"),
    baujahr: f.get("baujahr") ? Number(f.get("baujahr")) : null,
    farbe: f.get("farbe"),
    km: f.get("km") ? Number(f.get("km")) : null,
    tuevBis: f.get("tuevBis"),
    kaufpreis: Number(f.get("kaufpreis")) || 0,
    investitionGeplant: Number(f.get("investitionGeplant")) || 0,
    zielpreis: f.get("zielpreis") ? Number(f.get("zielpreis")) : null,
    partner: f.get("partner"),
    bildUrl: f.get("bildUrl") || "",
    notizen: f.get("notizen")
  };

  let bildDataUrl;
  const file = f.get("bildDatei");
  if (file && file.size > 0) {
    try {
      bildDataUrl = await readFileAsDataUrl(file);
    } catch (e) {
      alert("Bild konnte nicht gelesen werden: " + e.message);
    }
  }

  if (editingFahrzeugId) {
    const o = DATA.fahrzeuge.find(x => x.id === editingFahrzeugId);
    Object.assign(o, payload);
    if (bildDataUrl) o.bildDataUrl = bildDataUrl;
    editingFahrzeugId = null;
  } else {
    DATA.fahrzeuge.push({ id: uid(), status: "Bestand", investitionIst: 0, verkaufspreis: null, bildDataUrl: bildDataUrl || null, ...payload });
  }
  saveData(); renderAll();
}

function editFahrzeug(id) {
  editingFahrzeugId = id;
  renderAutohandel();
  const formEl = document.getElementById("form-fahrzeug");
  if (formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function cancelEditFahrzeug() {
  editingFahrzeugId = null;
  renderAutohandel();
}

function markFahrzeugVerkauft(id) {
  const f = DATA.fahrzeuge.find(x => x.id === id);
  if (!f) return;
  const preis = prompt(`Verkaufspreis für ${f.marke} ${f.modell} (€):`, f.zielpreis || "");
  if (preis === null) return;
  const investIst = prompt("Tatsächliche Investition bis zum Verkauf (€):", f.investitionGeplant || 0);
  if (investIst === null) return;
  f.status = "Verkauft";
  f.verkaufspreis = Number(preis) || 0;
  f.investitionIst = Number(investIst) || 0;

function deleteFahrzeug(id) {

}

// Welche Kosten-Kategorie steuerlich wie zu behandeln ist -- siehe Notiz
// im Steuerjahr-Export-Kasten oben: nicht alles, was "umlagefähig" nein
// ist, ist auch sofort als Werbungskosten abzugsfähig. Kaufnebenkosten
// gehören in die AfA-Basis (Abschreibung über Jahre), Tilgung ist reiner
// Vermögensaufbau und steuerlich gar nicht abzugsfähig.
const STEUER_EINORDNUNG = {
  "Grundsteuer": "werbungskosten",
  "Müll/Wasser/Abwasser": "werbungskosten",
  "Versicherung (Gebäude/Haftpflicht)": "werbungskosten",
  "Hausverwaltung": "werbungskosten",
  "Instandhaltung/Reparatur": "werbungskosten",
  "Modernisierung/Sanierung": "pruefen",
  "Notar/Grundbuch (Kaufnebenkosten)": "afa",
  "Maklerprovision (Kaufnebenkosten)": "afa",
  "Grunderwerbsteuer (Kaufnebenkosten)": "afa",
  "Kreditzinsen": "werbungskosten",
  "Kredittilgung": "nicht_abzugsfaehig",
  "Mieter-Entschädigung": "werbungskosten",
  "Sonstiges": "werbungskosten"
};

function steuerjahrJahre() {
  const jahre = new Set();
  for (const m of DATA.mieteinnahmen) if (m.datum) jahre.add(m.datum.slice(0, 4));
  for (const k of DATA.kosten) if (k.datum) jahre.add(k.datum.slice(0, 4));
  jahre.add(String(new Date().getFullYear()));
  return Array.from(jahre).sort().reverse();
}

function computeSteuerjahr(objektFilter, jahr) {
  const objekte = objektFilter === "alle" ? DATA.objekte : DATA.objekte.filter(o => o.id === objektFilter);
  return objekte.map(o => {
    const einnahmen = DATA.mieteinnahmen
      .filter(m => m.objektId === o.id && (m.datum || "").startsWith(jahr))
      .reduce((s, m) => s + Number(m.betrag), 0);
    const kostenJahr = DATA.kosten.filter(k => k.objektId === o.id && (k.datum || "").startsWith(jahr));

    const gruppen = { werbungskosten: {}, afa: {}, pruefen: {}, nicht_abzugsfaehig: {} };
    for (const k of kostenJahr) {
      const einordnung = STEUER_EINORDNUNG[k.kategorie] || "werbungskosten";
      gruppen[einordnung][k.kategorie] = (gruppen[einordnung][k.kategorie] || 0) + Number(k.betrag);
    }
    const summe = (obj) => Object.values(obj).reduce((s, v) => s + v, 0);
    const werbungskostenSumme = summe(gruppen.werbungskosten);
    const afaBasisSumme = summe(gruppen.afa);
    const pruefenSumme = summe(gruppen.pruefen);
    const tilgungSumme = summe(gruppen.nicht_abzugsfaehig);

    return {
      objekt: o, einnahmen, kostenJahr,
      gruppen, werbungskostenSumme, afaBasisSumme, pruefenSumme, tilgungSumme,
      ueberschuss: einnahmen - werbungskostenSumme
    };
  });
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.objekte) throw new Error("Ungültiges Format");
      DATA = parsed;
      saveData(); renderAll();
      alert("Import erfolgreich.");
    } catch (e) {
      alert("Konnte Datei nicht importieren: " + e.message);
    }
  };
  reader.readAsText(file);
}
