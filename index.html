<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D&amp;O Brothers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-elevated: #f7f7f7;
    --sidebar: #ffffff;
    --card: #ffffff;
    --card-hover: #f7f7f7;
    --card-border: #dddddd;
    --card-border-soft: #ebebeb;
    --accent: #ff385c;
    --accent-dim: #ffd9df;
    --accent-strong: #d70466;
    --accent-tint: rgba(255,56,92,.08);
    --gold: #b8860b;
    --text: #222222;
    --muted: #717171;
    --muted-dim: #b0b0b0;
    --green: #16794d;
    --green-tint: rgba(22,121,77,.08);
    --red: #c13515;
    --red-tint: rgba(193,53,21,.08);
    --yellow: #e0a823;
    --radius-lg: 14px;
    --radius-md: 10px;
    --radius-sm: 8px;
    --shadow-card: 0 1px 2px rgba(0,0,0,.06), 0 6px 16px rgba(0,0,0,.05);
    --shadow-pop: 0 1px 2px rgba(0,0,0,.08), 0 10px 24px rgba(0,0,0,.08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-elevated);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  ::selection { background: rgba(255,56,92,.2); }

  .app-shell { display: flex; min-height: 100vh; }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--card-border-soft);
    padding: 32px 20px;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .brand { display: flex; align-items: center; gap: 13px; padding: 0 2px 22px; }
  .brand .mark {
    width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px;
    border: 1px solid var(--card-border);
    background: var(--bg-elevated);
    display: flex; align-items: center; justify-content: center;
  }
  .brand .mark svg { display: block; }
  .brand .name { font-weight: 700; font-size: 15px; letter-spacing: 0; line-height: 1.25; color: var(--text); font-family: "Fraunces", serif; }
  .brand .name small { display:block; font-weight: 500; font-size: 10.5px; color: var(--muted); letter-spacing: .03em; margin-top: 4px; font-family: "Inter", sans-serif; }
  .brand-divider { height: 1px; background: var(--card-border-soft); margin: 0 2px 22px; }

  nav.tabs { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  nav.tabs button {
    display: flex; align-items: center; gap: 13px;
    background: none; border: none; text-align: left;
    color: var(--muted);
    padding: 11px 14px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0;
    position: relative;
    transition: color .15s ease, background .15s ease;
  }
  nav.tabs button .ico { font-size: 15px; width: 16px; text-align: center; opacity: .7; }
  nav.tabs button:hover { color: var(--text); background: var(--card-hover); }
  nav.tabs button.active {
    color: var(--accent-strong);
    background: var(--accent-tint);
  }
  nav.tabs button.active .ico { opacity: 1; }
  .sidebar-foot {
    margin-top: auto; padding: 18px 2px 4px; font-size: 11px; color: var(--muted-dim);
    border-top: 1px solid var(--card-border-soft); line-height: 1.8; letter-spacing: 0;
  }

  /* ---------- MAIN ---------- */
  .main { flex: 1; min-width: 0; padding: 44px 50px 110px; max-width: 1260px; }
  .page-head { margin-bottom: 34px; }
  .page-head h1 { font-size: 28px; margin: 0 0 8px; font-weight: 700; letter-spacing: -.01em; color: var(--text); }
  .sub { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 640px; letter-spacing: .005em; }

  .view { display: none; }
  .view.active { display: block; animation: fadeslide .35s cubic-bezier(.2,.8,.2,1); }
  @keyframes fadeslide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .toggle-group { display: inline-flex; border: 1px solid var(--card-border); border-radius: 999px; overflow: hidden; margin-bottom: 4px; background: var(--bg-elevated); }
  .toggle-btn {
    background: transparent; border: none; color: var(--muted); padding: 9px 18px;
    cursor: pointer; font-size: 13px; font-family: inherit; font-weight: 600;
    letter-spacing: 0; transition: background .15s ease, color .15s ease;
  }
  .toggle-btn:not(:last-child) { border-right: 1px solid var(--card-border); }
  .toggle-btn.active { background: var(--accent); color: #fff; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border-soft);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-card);
    padding: 26px 28px;
    margin-bottom: 18px;
  }
  .card h2 { font-size: 16px; margin: 0 0 18px; color: var(--text); font-weight: 700; display:flex; align-items:center; gap:10px; letter-spacing: 0; }
  .card h3 { font-size: 12px; margin: 22px 0 13px; color: var(--muted); font-weight: 700; letter-spacing: .02em; }

  /* ---------- Objekt "Listing"-Darstellung ---------- */
  .listing-hero {
    position: relative; width: 100%;
    height: 260px; border-radius: var(--radius-md); overflow: hidden;
    margin-bottom: 22px;
    background: var(--bg-elevated);
    border: 1px solid var(--card-border-soft);
  }
  .listing-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .listing-hero .overlay {
    position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,.65) 0%, rgba(0,0,0,.05) 48%, transparent 72%);
  }
  .listing-hero .overlay-text {
    position: absolute; left: 26px; right: 26px; bottom: 20px; color: #fff;
  }
  .listing-hero .overlay-text .addr { font-size: 22px; font-weight: 700; letter-spacing: 0; }
  .listing-hero .overlay-text .meta { font-size: 12px; opacity: .85; margin-top: 5px; letter-spacing: .02em; }
  .listing-hero.placeholder { display: flex; align-items: center; justify-content: center; font-size: 36px; opacity: .35; }
  .listing-hero .view-btn {
    position: absolute; right: 18px; bottom: 18px; width: 38px; height: 38px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 15px; font-weight: 700; box-shadow: var(--shadow-pop);
  }

  .objekt-head { display: flex; align-items: center; gap: 14px; margin-bottom: 6px; }
  .objekt-thumb {
    width: 48px; height: 48px; border-radius: var(--radius-sm); object-fit: cover;
    border: 1px solid var(--card-border-soft); flex-shrink: 0;
    background: var(--bg);
  }
  .objekt-thumb.placeholder {
    display:flex; align-items:center; justify-content:center; font-size:18px; color: var(--muted-dim);
    background: var(--bg-elevated);
  }
  .objekt-photo-large {
    width: 100%; border-radius: var(--radius-md); border: 1px solid var(--card-border-soft);
    display: block; margin-bottom: 16px; object-fit: cover; max-height: 300px;
  }

  .grid-kpi {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(175px, 1fr));
    gap: 14px;
    margin-bottom: 22px;
  }
  .kpi {
    background: var(--card);
    border: 1px solid var(--card-border-soft);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-card);
    padding: 18px 19px;
    transition: box-shadow .15s ease, border-color .15s ease;
  }
  .kpi:hover { border-color: var(--card-border); }
  .kpi .label { font-size: 11.5px; color: var(--muted); margin-bottom: 10px; font-weight: 600; letter-spacing: 0; }
  .kpi .value { font-size: 23px; font-weight: 700; letter-spacing: -.01em; font-variant-numeric: tabular-nums; color: var(--text); }
  .kpi .value.green { color: var(--green); }
  .kpi .value.red { color: var(--red); }
  .kpi .sub-note { font-size: 11px; color: var(--muted-dim); margin-top: 7px; letter-spacing: 0; }
  .kpi.hero { background: var(--accent-tint); border-color: var(--accent-dim); }
  .kpi.hero:hover { border-color: var(--accent-dim); }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 12px 14px; border-bottom: 1px solid var(--card-border-soft); }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: 0; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover { background: var(--card-hover); }
  tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 13.5px; }
  .tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0;
  }
  .tag.green { background: var(--green-tint); color: var(--green); }
  .tag.red { background: var(--red-tint); color: var(--red); }
  .tag.gold { background: rgba(184,134,11,.1); color: var(--gold); }
  .tag.muted { background: var(--bg-elevated); color: var(--muted); }

  form.inline { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-top: 20px; }
  .field { display: flex; flex-direction: column; gap: 7px; }
  .field label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .field input, .field select, .field textarea {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    font-size: 13.5px;
    font-family: inherit;
    min-width: 130px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus, .field select:focus, .field textarea:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint);
  }
  .field.wide input, .field.wide textarea { min-width: 230px; }
  .field.checkbox { flex-direction: row; align-items: center; gap: 8px; }
  .field.checkbox label { font-size: 13px; color: var(--text); text-transform: none; font-weight: 400; letter-spacing: 0; }
  .field.checkbox input { min-width: auto; accent-color: var(--accent); width: 16px; height: 16px; }

  button.primary {
    background: var(--accent);
    color: #fff;
    border: 1px solid var(--accent);
    padding: 11px 22px;
    border-radius: var(--radius-sm);
    font-weight: 600;
    cursor: pointer;
    font-size: 13.5px;
    font-family: inherit;
    letter-spacing: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  button.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }
  button.primary:active { opacity: .85; }
  button.ghost {
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0;
    transition: border-color .15s ease, background .15s ease;
  }
  button.ghost:hover { border-color: var(--text); background: var(--card-hover); }
  button.danger {
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--red);
    padding: 6px 13px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0;
    transition: background .15s ease, border-color .15s ease;
  }
  button.danger:hover { background: var(--red-tint); border-color: var(--red-tint); }

  .toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }

  .empty {
    color: var(--muted); font-size: 13px; padding: 36px 0; text-align: center;
    border: 1px dashed var(--card-border); border-radius: var(--radius-md); background: var(--bg-elevated);
    letter-spacing: 0;
  }

  .note { font-size: 12.5px; color: var(--muted); margin-top: 13px; line-height: 1.7; }

  .map-embed {
    width: 100%; height: 280px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-md);
    margin-bottom: 16px;
  }

  .progress-bar {
    width: 100%; height: 6px; border-radius: 999px; background: var(--card-border-soft);
    overflow: hidden; margin: 10px 0 4px;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 999px;
    background: var(--accent);
    transition: width .5s ease;
  }

  .fin-top { display: flex; gap: 0; align-items: stretch; flex-wrap: wrap; margin-bottom: 6px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-md); overflow: hidden; background: var(--card); box-shadow: var(--shadow-card); }
  .ring-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px; flex-shrink: 0; padding: 20px 28px; border-right: 1px solid var(--card-border-soft); }
  .ring-wrap .ring-label { font-size: 11.5px; color: var(--muted); font-weight: 600; text-align: center; max-width: 120px; letter-spacing: 0; }
  .ring-pct { font-size: 18px; font-weight: 800; fill: var(--text); }
  .fin-top .grid-kpi { border: none; flex: 1; gap: 0; margin-bottom: 0; }
  .fin-top .kpi { border: none; border-radius: 0; box-shadow: none; border-left: 1px solid var(--card-border-soft); }
  .fin-top .kpi:first-child { border-left: none; }

  details.edit-box { margin-top: 16px; }
  details.edit-box summary {
    cursor: pointer; color: var(--muted); font-size: 13px; padding: 8px 0; font-weight: 600;
    list-style: none; display: flex; align-items: center; gap: 7px;
    letter-spacing: 0;
  }
  details.edit-box summary:hover { color: var(--text); }
  details.edit-box summary::before { content: "+"; font-size: 13px; transition: transform .15s ease; color: var(--accent); }
  details.edit-box[open] summary::before { transform: rotate(45deg); }
  details.edit-box summary::-webkit-details-marker { display: none; }

  .formula-note {
    background: var(--bg-elevated); border: 1px solid var(--card-border-soft); border-radius: var(--radius-md);
    padding: 15px 18px; font-size: 12.5px; color: var(--muted); margin-top: 15px; line-height: 1.8;
  }
  .formula-note b { color: var(--text); }

  .warn-note {
    background: var(--accent-tint); border: 1px solid var(--accent-dim); border-radius: var(--radius-md);
    padding: 15px 18px; font-size: 12.5px; color: var(--accent-strong); margin-top: 15px; line-height: 1.8;
  }
  .warn-note b { color: var(--text); }
  .warn-note a { color: var(--accent-strong); }

  .serif { font-family: "Fraunces", "Inter", serif; font-weight: 600; }

  .value-split {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px;
  }
  .value-split .half { background: var(--card); padding: 26px 28px; border: 1px solid var(--card-border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); }
  .value-split .half.belw { background: #fff8f6; }
  .value-split .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--muted); margin-bottom: 10px; }
  .value-split .big { font-size: 36px; letter-spacing: -.01em; line-height: 1.05; }
  .value-split .half.markt .big { color: var(--gold, #b8860b); }
  .value-split .half.belw .big { color: var(--accent-strong); }
  .value-split .per-m2 { font-size: 12px; color: var(--muted-dim); margin-top: 8px; letter-spacing: 0; }

  tr.subtotal td { font-weight: 700; color: var(--text); border-top: 1px solid var(--card-border); }

  @media (max-width: 880px) {
    .value-split { grid-template-columns: 1fr; }
    .app-shell { flex-direction: column; }
    .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; align-items: center; padding: 16px 18px; overflow-x: auto; }
    .brand { padding: 0 16px 0 0; }
    nav.tabs { flex-direction: row; margin-top: 0; }
    .sidebar-foot { display: none; }
    .main { padding: 28px 22px 80px; }
  }
  #login-screen {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: var(--bg-elevated); z-index: 100;
  }
  .login-card {
    width: 100%; max-width: 340px; padding: 36px 32px;
    background: var(--card); border: 1px solid var(--card-border-soft); border-radius: var(--radius-lg);
    box-shadow: var(--shadow-pop);
    text-align: center;
  }
  .login-mark { display: flex; justify-content: center; margin-bottom: 14px; }
  .login-title {
    font-family: "Fraunces", serif; font-weight: 600; font-size: 20px; letter-spacing: 0;
    color: var(--text); margin-bottom: 4px;
  }
  .login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
  #login-form { display: flex; flex-direction: column; gap: 10px; }
  #login-form input {
    background: var(--bg-elevated); border: 1px solid var(--card-border); border-radius: var(--radius-sm);
    padding: 11px 12px; color: var(--text); font-size: 13px; font-family: inherit;
  }
  #login-form input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  #login-form button {
    margin-top: 6px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
    padding: 11px 12px; font-size: 14px; font-weight: 600; letter-spacing: 0;
    cursor: pointer;
  }
  #login-form button:hover { background: var(--accent-strong); }
  #login-form button:disabled { opacity: .5; cursor: default; }
  #login-error { font-size: 12px; color: var(--accent-strong); min-height: 16px; margin-top: 2px; }
  .sidebar-foot a#logout-link { color: var(--muted); text-decoration: underline; }
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-mark">
      <svg width="30" height="30" viewBox="0 0 22 22" fill="none">
        <text x="0" y="16.5" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="#B8860B" letter-spacing="-0.5">D</text>
        <line x1="10.6" y1="4" x2="10.6" y2="18" stroke="#B8860B" stroke-width=".6" opacity=".55"/>
        <text x="11.5" y="16.5" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="#B8860B" letter-spacing="-0.5">O</text>
      </svg>
    </div>
    <div class="login-title">D&amp;O Brothers</div>
    <div class="login-sub">Immobilien · Fahrzeuge — bitte anmelden</div>
    <form id="login-form">
      <input type="email" id="login-email" placeholder="E-Mail" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit" id="login-submit">Anmelden</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<div class="app-shell" id="app-shell" style="display:none;">
  <aside class="sidebar">
    <div class="brand">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <text x="0" y="16.5" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="#B8860B" letter-spacing="-0.5">D</text>
          <line x1="10.6" y1="4" x2="10.6" y2="18" stroke="#B8860B" stroke-width=".6" opacity=".55"/>
          <text x="11.5" y="16.5" font-family="Fraunces, serif" font-size="15" font-weight="600" fill="#B8860B" letter-spacing="-0.5">O</text>
        </svg>
      </div>
      <div class="name">D&amp;O Brothers<small>Immobilien · Fahrzeuge</small></div>
    </div>
    <div class="brand-divider"></div>

    <nav class="tabs">
      <button data-view="dashboard" class="active"><span class="ico">📊</span>Übersicht</button>
      <button data-view="objekte"><span class="ico">🏗️</span>Objekte</button>
      <button data-view="finanzierung"><span class="ico">🏦</span>Finanzierung &amp; Vermögen</button>
      <button data-view="rechner"><span class="ico">🧮</span>Darlehensrechner</button>
      <button data-view="wertermittlung"><span class="ico">⚖️</span>Wertermittlung</button>
      <button data-view="miete"><span class="ico">💶</span>Buchungen</button>
      <button data-view="autohandel"><span class="ico">🚗</span>Autohandel</button>
      <button data-view="fahrzeugbewertung"><span class="ico">💰</span>Fahrzeugbewertung</button>
      <button data-view="daten"><span class="ico">⚙️</span>Daten</button>
    </nav>

    <div class="sidebar-foot">Angemeldet als <span id="sidebar-user-email"></span><br><a href="#" id="logout-link">Abmelden</a></div>
  </aside>

  <main class="main">
    <div class="page-head">
      <h1>D&amp;O Brothers</h1>
      <div class="sub">Immobilien, Fahrzeuge, Finanzierung und Vermögensaufbau — alles an einem Ort.</div>
    </div>

    <div class="view active" id="view-dashboard"></div>
    <div class="view" id="view-objekte"></div>
    <div class="view" id="view-finanzierung"></div>
    <div class="view" id="view-rechner"></div>
    <div class="view" id="view-wertermittlung"></div>
    <div class="view" id="view-miete"></div>
    <div class="view" id="view-autohandel"></div>
    <div class="view" id="view-fahrzeugbewertung"></div>
    <div class="view" id="view-daten"></div>

async function loadDataFirestore() {
  const snap = await SHARED_DOC.get();
  if (snap.exists) {
    return normalizeData(snap.data());
  }
  const initial = defaultData();
  await SHARED_DOC.set(initial);
  return initial;
}
function saveDataFirestore() {
  SHARED_DOC.set(DATA).catch(err => {
    console.error("Firestore-Speichern fehlgeschlagen:", err);
    alert("Änderung konnte nicht gespeichert werden (keine Verbindung?). Bitte Internetverbindung prüfen und die letzte Änderung ggf. wiederholen.");

// Live-Sync: hält einen offenen Tab automatisch aktuell, wenn auf einem
// ANDEREN Gerät (Handy, Mac, Kollege) etwas geändert wird -- ohne das
// müsste man manuell neu laden, um den aktuellen Stand zu sehen.
let firestoreUnsubscribe = null;
function startFirestoreListener() {
  if (firestoreUnsubscribe) firestoreUnsubscribe();
  firestoreUnsubscribe = SHARED_DOC.onSnapshot((snap) => {
    if (!snap.exists) return; // wird nur beim allerersten Login angelegt
    // hasPendingWrites = true heißt: das ist die lokale Bestätigung unserer
    // EIGENEN gerade erst gesendeten Änderung -- die haben wir schon
    // gerendert (siehe "saveData(); renderAll();"-Muster), kein erneutes
    // renderAll() nötig. Nur auf wirklich von außen kommende Änderungen
    // reagieren.
    if (snap.metadata.hasPendingWrites) return;
    DATA = normalizeData(snap.data());
    renderAll();
  }, (err) => {
    console.error("Firestore-Live-Sync fehlgeschlagen:", err);
  });
}
function stopFirestoreListener() {
  if (firestoreUnsubscribe) { firestoreUnsubscribe(); firestoreUnsubscribe = null; }
}

// ============================================================
// FINANZIERUNG / TILGUNGSPLAN
// ============================================================
function hatFinanzierung(o) {
  return o.darlehenssumme && o.zinssatz != null && o.tilgungssatz != null && o.kreditstart;
}

function monatlicheRate(o) {
  if (!hatFinanzierung(o)) return 0;
  return o.darlehenssumme * (o.zinssatz + o.tilgungssatz) / 100 / 12;
}

// Monatliche Amortisationstabelle vom Kreditstart bis zu einem Zieldatum (inkl.)
function amortisationMonatlich(o, bisDatum) {
  if (!hatFinanzierung(o)) return [];
  const rate = monatlicheRate(o);
  let restschuld = o.darlehenssumme;
  const start = new Date(o.kreditstart + "T00:00:00");
  const end = new Date(bisDatum + "T00:00:00");
  const rows = [];
  let cursor = new Date(start);
  while (cursor <= end && restschuld > 0.01) {
    const zinsanteil = restschuld * (o.zinssatz / 100) / 12;
    let tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil > restschuld) tilgungsanteil = restschuld;
    restschuld = Math.max(0, restschuld - tilgungsanteil);
    rows.push({
      jahr: cursor.getFullYear(),
      monat: cursor.getMonth() + 1,
      zinsanteil, tilgungsanteil, restschuld
    });
    cursor.setMonth(cursor.getMonth() + 1);
  }
  return rows;
}

function heuteISO() {
  return new Date().toISOString().slice(0, 10);
}

function finanzKennzahlen(o) {
  if (!hatFinanzierung(o)) return null;
  const rows = amortisationMonatlich(o, heuteISO());
  const restschuldAktuell = rows.length ? rows[rows.length - 1].restschuld : o.darlehenssumme;
  const getilgtGesamt = o.darlehenssumme - restschuldAktuell;
  const letzte = rows[rows.length - 1] || { zinsanteil: 0, tilgungsanteil: 0 };
  return {
    rate: monatlicheRate(o),
    restschuldAktuell,
    getilgtGesamt,
    fortschrittProzent: o.darlehenssumme ? (getilgtGesamt / o.darlehenssumme) * 100 : 0,
    aktuellerZinsanteil: letzte.zinsanteil,
    aktuellerTilgungsanteil: letzte.tilgungsanteil,
    monateGezahlt: rows.length
  };
}

function amortisationJaehrlich(o) {
  const rows = amortisationMonatlich(o, heuteISO());
  const byYear = {};
  rows.forEach(r => {
    if (!byYear[r.jahr]) byYear[r.jahr] = { jahr: r.jahr, zinsen: 0, tilgung: 0, restschuldEnde: r.restschuld };
    byYear[r.jahr].zinsen += r.zinsanteil;
    byYear[r.jahr].tilgung += r.tilgungsanteil;
    byYear[r.jahr].restschuldEnde = r.restschuld;
  });
  return Object.values(byYear).sort((a, b) => a.jahr - b.jahr);
}

// ============================================================
// DARLEHENSRECHNER (Tab) — freies Planungstool, unabhängig von Objekten,
// nichts wird gespeichert (bewusst ein Scratch-Tool).
// ============================================================
let rechnerInitialized = false;
let rechnerModus = "satz"; // "satz" = Tilgungssatz eingeben, "rate" = feste Monatsrate eingeben
let rechnerSondertilgungen = []; // { id, datum, betrag } — nur im Speicher, kein DATA/localStorage

// Reine Rechenfunktion, unabhängig vom DOM — testbar ohne Browser.
function rechnerBerechnen(input) {
  const errors = [];
  const darlehenssumme = Number(input.darlehenssumme) || 0;
  const zinssatz = input.zinssatz != null ? Number(input.zinssatz) : null;

  if (!darlehenssumme || darlehenssumme <= 0) errors.push("Darlehenssumme fehlt oder ist 0.");
  if (zinssatz == null || zinssatz < 0) errors.push("Zinssatz fehlt.");
  if (!input.kreditstart) errors.push("Kreditstart fehlt.");
  if (errors.length) return { errors, warnings: [] };

  let rate, tilgungssatzAnfang;
  if (input.modus === "rate") {
    const monatsrate = Number(input.monatsrate) || 0;
    if (monatsrate <= 0) return { errors: ["Monatliche Rate fehlt."], warnings: [] };
    rate = monatsrate;
    tilgungssatzAnfang = (rate * 12 / darlehenssumme) * 100 - zinssatz;
  } else if (input.modus === "laufzeit") {
    const laufzeitJahre = Number(input.laufzeitJahre) || 0;
    const nMonate = Math.round(laufzeitJahre * 12);
    if (nMonate <= 0) return { errors: ["Gewünschte Laufzeit fehlt."], warnings: [] };
    const iMonat = zinssatz / 100 / 12;
    // Annuitätenformel: welche konstante Monatsrate tilgt die Darlehenssumme in genau n Monaten voll ab?
    rate = iMonat > 0
      ? darlehenssumme * iMonat / (1 - Math.pow(1 + iMonat, -nMonate))
      : darlehenssumme / nMonate; // Sonderfall 0 % Zins: lineare Tilgung
    tilgungssatzAnfang = (rate * 12 / darlehenssumme) * 100 - zinssatz;
  } else {
    const tilgungssatz = Number(input.tilgungssatz) || 0;
    if (tilgungssatz <= 0) return { errors: ["Tilgungssatz fehlt."], warnings: [] };
    tilgungssatzAnfang = tilgungssatz;
    rate = darlehenssumme * (zinssatz + tilgungssatz) / 100 / 12;
  }

  const zinsanteilStart = darlehenssumme * (zinssatz / 100) / 12;
  if (rate <= zinsanteilStart) {
    return { errors: [`Die Monatsrate (${fmtEUR(rate)}) deckt nicht einmal die Zinsen (${fmtEUR(zinsanteilStart)}) — die Restschuld würde nie sinken. Tilgungssatz bzw. Rate erhöhen.`], warnings: [] };
  }

  // Einmalige Sondertilgungen nach Monats-Key ("YYYY-M") vorsortieren
  const einmaligeByKey = {};
  (input.sondertilgungenEinmalig || []).forEach(s => {
    if (!s.datum || !s.betrag) return;
    const d = new Date(s.datum + "T00:00:00");
    const key = d.getFullYear() + "-" + (d.getMonth() + 1);
    einmaligeByKey[key] = (einmaligeByKey[key] || 0) + Number(s.betrag);
  });

  const sondertilgungJaehrlich = Number(input.sondertilgungJaehrlich) || 0;
  const grenzeProzent = input.sondertilgungsGrenzeProzent != null ? Number(input.sondertilgungsGrenzeProzent) : null;
  const grenzeBetrag = grenzeProzent != null ? darlehenssumme * (grenzeProzent / 100) : null;

  const zinsbindungMonate = input.zinsbindungJahre ? Math.round(Number(input.zinsbindungJahre) * 12) : null;
  const maxMonths = 50 * 12; // Sicherheitsgrenze gegen Endlosschleifen bei unsinnigen Eingaben

  let restschuld = darlehenssumme;
  const rows = [];
  let cursor = new Date(input.kreditstart + "T00:00:00");
  let monat = 0;
  let gesamtzinsen = 0;
  let gesamtsondertilgung = 0;
  let jahresSonder = 0;
  let jahresBegin = cursor.getFullYear();
  const warnings = [];
  let hitMaxMonths = false;
  let gestopptDurchZinsbindung = false;

  while (restschuld > 0.01) {
    if (zinsbindungMonate != null && monat >= zinsbindungMonate) { gestopptDurchZinsbindung = true; break; }
    if (monat >= maxMonths) { hitMaxMonths = true; break; }

    const jahr = cursor.getFullYear();
    if (jahr !== jahresBegin) {
      if (grenzeBetrag != null && jahresSonder > grenzeBetrag + 0.01) {
        warnings.push(`Sondertilgung ${jahresBegin}: ${fmtEUR(jahresSonder)} überschreitet die Grenze von ${fmtEUR(grenzeBetrag)} (${grenzeProzent}% / Jahr).`);
      }
      jahresBegin = jahr;
      jahresSonder = 0;
    }

    const zinsanteil = restschuld * (zinssatz / 100) / 12;
    let tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil > restschuld) tilgungsanteil = restschuld;
    restschuld -= tilgungsanteil;
    gesamtzinsen += zinsanteil;

    let sonder = 0;
    const key = jahr + "-" + (cursor.getMonth() + 1);
    if (einmaligeByKey[key]) sonder += einmaligeByKey[key];
    if (sondertilgungJaehrlich && cursor.getMonth() === 11) sonder += sondertilgungJaehrlich;
    if (sonder > restschuld) sonder = restschuld;
    restschuld = Math.max(0, restschuld - sonder);
    gesamtsondertilgung += sonder;
    jahresSonder += sonder;

    rows.push({ jahr, monat: cursor.getMonth() + 1, zinsanteil, tilgungsanteil, sonder, restschuld });
    if (restschuld <= 0.01) restschuld = 0;

    cursor.setMonth(cursor.getMonth() + 1);
    monat++;
  }
  // Grenzprüfung fürs letzte (ggf. unvollständige) Jahr nachholen
  if (grenzeBetrag != null && jahresSonder > grenzeBetrag + 0.01) {
    warnings.push(`Sondertilgung ${jahresBegin}: ${fmtEUR(jahresSonder)} überschreitet die Grenze von ${fmtEUR(grenzeBetrag)} (${grenzeProzent}% / Jahr).`);
  }
  if (hitMaxMonths) {
    warnings.push("Nach 50 Jahren ist die Restschuld immer noch nicht auf 0 — Eingaben prüfen (Rate evtl. zu niedrig).");
  }

  const restschuldEnde = rows.length ? rows[rows.length - 1].restschuld : darlehenssumme;
  const vollstaendigGetilgt = restschuldEnde <= 0.01;

  const byYear = {};
  rows.forEach(r => {
    if (!byYear[r.jahr]) byYear[r.jahr] = { jahr: r.jahr, zinsen: 0, tilgung: 0, sonder: 0, restschuldEnde: r.restschuld };
    byYear[r.jahr].zinsen += r.zinsanteil;
    byYear[r.jahr].tilgung += r.tilgungsanteil;
    byYear[r.jahr].sonder += r.sonder;
    byYear[r.jahr].restschuldEnde = r.restschuld;
  });

  return {
    errors: [],
    warnings,
    rate,
    tilgungssatzAnfang,
    zinsanteilStart: rows[0] ? rows[0].zinsanteil : zinsanteilStart,
    tilgungsanteilStart: rows[0] ? rows[0].tilgungsanteil : (rate - zinsanteilStart),
    monateGerechnet: rows.length,
    restschuldEnde,
    vollstaendigGetilgt,
    gestopptDurchZinsbindung,
    gesamtzinsen,
    gesamtsondertilgung,
    fortschrittProzent: darlehenssumme ? ((darlehenssumme - restschuldEnde) / darlehenssumme) * 100 : 0,
    jahresRows: Object.values(byYear).sort((a, b) => a.jahr - b.jahr)
  };
}

    kreditstart: document.getElementById("r-kreditstart").value,

function monateAlsJahreText(monate) {

  const rest = monate % 12;
  if (jahre === 0) return `${rest} Monate`;
  if (rest === 0) return `${jahre} Jahre`;
  return `${jahre} Jahre, ${rest} Monate`;
}

function updateRechnerErgebnis() {

// ============================================================
// BALLONKREDITRECHNER (innerhalb des Darlehensrechner-Tabs) — für Autokredite
// mit Drei-Wege-Finanzierung: niedrige Monatsraten + große Schlussrate am Ende.
// ============================================================
let ballonModus = "schlussrate"; // "schlussrate" = Schlussrate vorgeben, "rate" = Monatsrate vorgeben

// Reine Rechenfunktion, unabhängig vom DOM — testbar ohne Browser.
function ballonBerechnen(input) {
  const errors = [];
  const kaufpreis = Number(input.kaufpreis) || 0;
  const anzahlung = Number(input.anzahlung) || 0;
  const zinssatz = input.zinssatz != null ? Number(input.zinssatz) : null;
  const n = Math.round(Number(input.laufzeitMonate) || 0);
  const darlehensbetrag = kaufpreis - anzahlung;

  if (!kaufpreis || kaufpreis <= 0) errors.push("Kaufpreis fehlt oder ist 0.");
  if (anzahlung < 0) errors.push("Anzahlung darf nicht negativ sein.");
  if (kaufpreis > 0 && darlehensbetrag <= 0) errors.push("Anzahlung ist größer oder gleich dem Kaufpreis — kein Darlehen nötig.");
  if (zinssatz == null || zinssatz < 0) errors.push("Zinssatz fehlt.");
  if (n <= 0) errors.push("Laufzeit fehlt.");
  if (errors.length) return { errors, warnings: [] };

  const i = zinssatz / 100 / 12;
  const abzinsfaktorN = i > 0 ? Math.pow(1 + i, -n) : 1;
  const annuitaetenfaktor = i > 0 ? (1 - abzinsfaktorN) / i : n;

  let rate;
  if (input.modus === "rate") {
    rate = Number(input.monatsrate) || 0;
    if (rate <= 0) return { errors: ["Monatliche Rate fehlt."], warnings: [] };
  } else {
    const schlussrateVorgabe = Number(input.schlussrate) || 0;
    if (schlussrateVorgabe < 0) return { errors: ["Schlussrate fehlt."], warnings: [] };
    rate = i > 0
      ? (darlehensbetrag - schlussrateVorgabe * abzinsfaktorN) / annuitaetenfaktor
      : (darlehensbetrag - schlussrateVorgabe) / n;
    if (rate <= 0) {
      return { errors: ["Die Schlussrate ist bei dieser Laufzeit/diesem Zins zu hoch — die resultierende Monatsrate wäre 0 oder negativ. Schlussrate senken oder Laufzeit verlängern."], warnings: [] };
    }
  }

  // n volle Monatsraten tilgen die Restschuld wie bei einem normalen Annuitätendarlehen;
  // was danach übrig bleibt, ist genau die Schlussrate — als separate Zahlung zusätzlich zur letzten Monatsrate fällig.
  let restschuld = darlehensbetrag;
  const rows = [];
  let gesamtzinsen = 0;
  const warnings = [];

  for (let m = 1; m <= n; m++) {
    const zinsanteil = restschuld * i;
    const tilgungsanteil = rate - zinsanteil;
    if (tilgungsanteil < 0) {
      warnings.push(`Monat ${m}: Die Rate deckt die Zinsen nicht — die Restschuld steigt in diesem Monat statt zu sinken.`);
    }
    restschuld -= tilgungsanteil;
    gesamtzinsen += zinsanteil;
    rows.push({ monat: m, zahlung: rate, zinsanteil, tilgungsanteil, restschuld, istSchlussrate: false });
  }

  const schlussrateIst = Math.max(0, restschuld);
  rows.push({ monat: n, zahlung: schlussrateIst, zinsanteil: 0, tilgungsanteil: schlussrateIst, restschuld: 0, istSchlussrate: true });

  const gesamtkostenRaten = rate * n + schlussrateIst;

  return {
    errors: [],
    warnings,
    darlehensbetrag,
    rate,
    schlussrateIst,
    gesamtzinsen,
    gesamtkosten: gesamtkostenRaten + anzahlung,
    rows
  };
}

// ============================================================
// WERTERMITTLUNG: Marktwert (Ertragswertverfahren) & Beleihungswert (BelWertV-nah)
// ============================================================

// Jahresrohertrag wird live aus den Einheiten abgeleitet (Soll-Kaltmiete × 12) —
// keine Zahl doppelt pflegen, derselbe Wert wie auf dem Dashboard.
function rohertragJahr(o) {
  return o.einheiten.reduce((s, e) => s + Number(e.kaltmiete || 0), 0) * 12;
}

function vervielfaeltiger(zinsProzent, jahre) {
  const i = zinsProzent / 100;
  if (i <= 0 || jahre <= 0) return 0;
  return (1 - Math.pow(1 + i, -jahre)) / i;
}

function berechneMarktwert(o) {
  const rohertrag = rohertragJahr(o);
  const bodenwert = o.grundstueck * o.bodenrichtwert;
  const verwaltung = 300 * o.einheiten.length;
  const instandhaltung = 12 * o.wohnflaeche;
  const mietausfall = 0.02 * rohertrag;
  const bewirtschaftung = verwaltung + instandhaltung + mietausfall;
  const reinertrag = rohertrag - bewirtschaftung;
  const bodenwertverzinsung = bodenwert * (o.liegenschaftszins / 100);
  const gebaeudereinertrag = reinertrag - bodenwertverzinsung;
  const verv = vervielfaeltiger(o.liegenschaftszins, o.restnutzungsdauer);
  const gebaeudeertragswert = gebaeudereinertrag * verv;
  const marktwert = bodenwert + gebaeudeertragswert;
  return { rohertrag, bodenwert, verwaltung, instandhaltung, mietausfall, bewirtschaftung, reinertrag, bodenwertverzinsung, gebaeudereinertrag, verv, gebaeudeertragswert, marktwert };
}

function berechneBeleihungswert(o) {
  const rohertrag = rohertragJahr(o);
  const bodenwert = o.grundstueck * o.bodenrichtwert;
  const nachhaltigeMiete = rohertrag * (o.nachhaltigeMieteProzent / 100);
  const belwertBewirtschaftung = nachhaltigeMiete * (o.belwertBewirtschaftungProzent / 100);
  const nachhaltigerReinertrag = nachhaltigeMiete - belwertBewirtschaftung;
  const belwertZins = o.liegenschaftszins + o.belwertZinsZuschlag;
  const bodenwertverzinsung = bodenwert * (belwertZins / 100);
  const gebaeudereinertrag = nachhaltigerReinertrag - bodenwertverzinsung;
  const verv = vervielfaeltiger(belwertZins, o.restnutzungsdauer);
  const gebaeudeertragswert = gebaeudereinertrag * verv;
  const rohwert = bodenwert + gebaeudeertragswert;
  const abschlag = rohwert * (o.belwertSicherheitsabschlagProzent / 100);
  const beleihungswert = rohwert - abschlag;
  return { rohertrag, bodenwert, nachhaltigeMiete, belwertBewirtschaftung, nachhaltigerReinertrag, belwertZins, bodenwertverzinsung, gebaeudereinertrag, verv, gebaeudeertragswert, rohwert, abschlag, beleihungswert };
}

// Kleiner SVG-Fortschrittsring (z.B. für Tilgungsfortschritt)
function renderRing(percent, labelHtml) {
  const p = Math.max(0, Math.min(100, percent));
  const r = 42, c = 2 * Math.PI * r;
  const offset = c * (1 - p / 100);
  return `
    <div class="ring-wrap">
      <svg width="110" height="110" viewBox="0 0 110 110">
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="#ebebeb" stroke-width="8"></circle>
        <circle cx="55" cy="55" r="${r}" fill="none" stroke="url(#ringGrad)" stroke-width="8"

function renderDashboard() {
  const el = document.getElementById("view-dashboard");
  if (DATA.objekte.length === 0) {
    el.innerHTML = `<div class="card"><div class="empty">Noch keine Objekte angelegt. Leg unter "🏗️ Objekte" dein erstes Objekt an.</div></div>`;
    return;
  }

  let html = "";
  let gesamtEinnahmen = 0, gesamtKostenUmlage = 0, gesamtKostenSelbst = 0, gesamtVermoegen = 0, gesamtUeberschussVorSteuern = 0;

  for (const o of DATA.objekte) {
    const einnahmen = DATA.mieteinnahmen
      .filter(m => m.objektId === o.id)
      .reduce((s, m) => s + Number(m.betrag), 0);
    const kostenObjekt = DATA.kosten.filter(k => k.objektId === o.id);
    const kostenUmlage = kostenObjekt.filter(k => k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
    const kostenSelbst = kostenObjekt.filter(k => !k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
    const sollMieteMonat = o.einheiten.reduce((s, e) => s + Number(e.kaltmiete || 0), 0);
    const mietueberschuss = einnahmen - kostenSelbst;

    const fk = finanzKennzahlen(o);
    const vermoegen = (fk ? fk.getilgtGesamt : 0) + mietueberschuss;
    const monatlicheRateObjekt = fk ? fk.rate : 0;
    const ueberschussVorSteuern = sollMieteMonat - monatlicheRateObjekt;

    gesamtEinnahmen += einnahmen;
    gesamtKostenUmlage += kostenUmlage;
    gesamtKostenSelbst += kostenSelbst;
    gesamtVermoegen += vermoegen;
    gesamtUeberschussVorSteuern += ueberschussVorSteuern;

    const metaText = `${o.einheiten.length} Einheit${o.einheiten.length === 1 ? "" : "en"}${o.typ ? " · " + o.typ : ""}${o.baujahr ? " · Baujahr " + o.baujahr : ""}`;

    html += `
      <div class="card">
        ${listingHero(o, metaText)}
        <div class="grid-kpi">
          <div class="kpi"><div class="label">Soll-Kaltmiete (alle Einheiten) €/Monat</div><div class="value">${fmtEUR(sollMieteMonat)}</div></div>
          <div class="kpi hero"><div class="label">Überschuss vor Steuern €/Monat</div><div class="value ${ueberschussVorSteuern >= 0 ? 'green' : 'red'}">${fmtEUR(ueberschussVorSteuern)}</div><div class="sub-note">${fk ? "Soll-Miete − Kreditrate (Zins+Tilgung)" : "kein Darlehen hinterlegt = volle Miete"}</div></div>
          <div class="kpi"><div class="label">Tatsächliche Mieteinnahmen (erfasst)</div><div class="value green">${fmtEUR(einnahmen)}</div></div>
          <div class="kpi"><div class="label">Kosten nicht umlagefähig (ich selbst)</div><div class="value red">${fmtEUR(kostenSelbst)}</div></div>
          ${fk ? `<div class="kpi"><div class="label">Restschuld aktuell</div><div class="value">${fmtEUR(fk.restschuldAktuell)}</div><div class="sub-note">${fk.fortschrittProzent.toFixed(2)} % bereits getilgt</div></div>` : ""}
          <div class="kpi"><div class="label">Vermögensaufbau bisher</div><div class="value ${vermoegen >= 0 ? 'green' : 'red'}">${fmtEUR(vermoegen)}</div><div class="sub-note">Tilgung + Mietüberschuss</div></div>
        </div>
      </div>`;
  }

  html = `
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Gesamt-Mieteinnahmen (erfasst)</div><div class="value green">${fmtEUR(gesamtEinnahmen)}</div></div>
      <div class="kpi hero"><div class="label">Überschuss vor Steuern gesamt €/Monat</div><div class="value ${gesamtUeberschussVorSteuern >= 0 ? 'green' : 'red'}">${fmtEUR(gesamtUeberschussVorSteuern)}</div></div>
      <div class="kpi"><div class="label">Gesamt-Kosten umlagefähig</div><div class="value">${fmtEUR(gesamtKostenUmlage)}</div></div>
      <div class="kpi"><div class="label">Gesamt-Kosten eigene Last</div><div class="value red">${fmtEUR(gesamtKostenSelbst)}</div></div>
      <div class="kpi"><div class="label">Vermögensaufbau gesamt</div><div class="value ${gesamtVermoegen >= 0 ? 'green' : 'red'}">${fmtEUR(gesamtVermoegen)}</div></div>
    </div>
    <div class="note" style="margin:-8px 0 20px">„Überschuss vor Steuern" = Soll-Kaltmiete abzüglich der kompletten monatlichen Kreditrate (Zins- und Tilgungsanteil) — das ist, was von der Miete tatsächlich monatlich bei dir ankommt, bevor Einkommensteuer auf die Mieteinnahmen anfällt. Einmalige/nicht wiederkehrende Kosten (Notar, Makler etc.) sind hier bewusst nicht mit eingerechnet, da sie keine laufenden Monatskosten sind.</div>
  ` + html;

  el.innerHTML = html;
}

function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

  ev.preventDefault();
  const f = new FormData(ev.target);
  DATA.objekte.push({
    id: uid(),
    adresse: f.get("adresse"),
    typ: f.get("typ"),
    baujahr: Number(f.get("baujahr")) || null,
    wohnflaeche: Number(f.get("wohnflaeche")) || null,

  });

async function updateObjekt(ev, objektId) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const o = getObjekt(objektId);
  o.adresse = f.get("adresse");
  o.typ = f.get("typ");
  o.baujahr = Number(f.get("baujahr")) || null;
  o.wohnflaeche = Number(f.get("wohnflaeche")) || null;
  o.grundstueck = Number(f.get("grundstueck")) || null;
  o.energieeffizienzklasse = f.get("energieeffizienzklasse");
  o.kaufpreis = Number(f.get("kaufpreis")) || null;
  o.kaufdatum = f.get("kaufdatum") || null;
  o.bildUrl = f.get("bildUrl") || "";
  o.kartenAdresse = f.get("kartenAdresse") || "";
  o.darlehenssumme = f.get("darlehenssumme") ? Number(f.get("darlehenssumme")) : null;
  o.zinssatz = f.get("zinssatz") ? Number(f.get("zinssatz")) : null;
  o.tilgungssatz = f.get("tilgungssatz") ? Number(f.get("tilgungssatz")) : null;
  o.kreditstart = f.get("kreditstart") || null;
  o.bodenrichtwert = Number(f.get("bodenrichtwert")) || 0;
  o.liegenschaftszins = Number(f.get("liegenschaftszins")) || 0;
  o.restnutzungsdauer = Number(f.get("restnutzungsdauer")) || 0;
  o.nachhaltigeMieteProzent = Number(f.get("nachhaltigeMieteProzent")) || 0;
  o.belwertBewirtschaftungProzent = Number(f.get("belwertBewirtschaftungProzent")) || 0;
  o.belwertZinsZuschlag = Number(f.get("belwertZinsZuschlag")) || 0;
  o.belwertSicherheitsabschlagProzent = Number(f.get("belwertSicherheitsabschlagProzent")) || 0;

  const file = f.get("bildDatei");
  if (file && file.size > 0) {
    try {
      o.bildDataUrl = await readFileAsDataUrl(file);
    } catch (e) {
      alert("Bild konnte nicht gelesen werden: " + e.message);
    }
  }

  saveData(); renderAll();
}

function deleteObjekt(id) {
  if (!confirm("Objekt inkl. aller zugehörigen Mieteinnahmen und Kosten wirklich löschen?")) return;
  DATA.objekte = DATA.objekte.filter(o => o.id !== id);
  DATA.mieteinnahmen = DATA.mieteinnahmen.filter(m => m.objektId !== id);
  DATA.kosten = DATA.kosten.filter(k => k.objektId !== id);
  saveData(); renderAll();
}

function addEinheit(ev, objektId) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const o = getObjekt(objektId);
  o.einheiten.push({
    id: uid(),
    name: f.get("name"),
    flaeche: Number(f.get("flaeche")),
    zimmer: Number(f.get("zimmer")),
    kaltmiete: Number(f.get("kaltmiete")),
    status: f.get("status")
  });
  saveData(); renderAll();
}

function deleteEinheit(objektId, einheitId) {
  if (!confirm("Einheit wirklich löschen?")) return;
  const o = getObjekt(objektId);
  o.einheiten = o.einheiten.filter(e => e.id !== einheitId);
  saveData(); renderAll();
}

  el.innerHTML = html;
}

function renderBuchungen() {
  const el = document.getElementById("view-miete");
  if (DATA.objekte.length === 0) {
    el.innerHTML = `<div class="card"><div class="empty">Erst ein Objekt unter "🏗️ Objekte" anlegen.</div></div>`;
    return;
  }

  const objOptions = DATA.objekte.map(o => `<option value="${o.id}">${o.adresse}</option>`).join("");
  const katOptions = KOSTEN_KATEGORIEN.map(k => `<option value="${k}">${k}</option>`).join("");

  const sumEinnahmen = DATA.mieteinnahmen.reduce((s, m) => s + Number(m.betrag), 0);
  const sumUmlage = DATA.kosten.filter(k => k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);
  const sumSelbst = DATA.kosten.filter(k => !k.umlagefaehig).reduce((s, k) => s + Number(k.betrag), 0);

  // Beide Listen zu einer chronologischen Buchungsliste zusammenführen
  const einnahmenRows = DATA.mieteinnahmen.map(m => ({ ...m, _typ: "einnahme" }));
  const kostenRows = DATA.kosten.map(k => ({ ...k, _typ: "kosten" }));
  const alle = [...einnahmenRows, ...kostenRows].sort((a, b) => (b.datum || "").localeCompare(a.datum || ""));

  let rows = alle.map(b => {
    const o = getObjekt(b.objektId);
    if (b._typ === "einnahme") {
      const e = getEinheit(b.objektId, b.einheitId);
      return `<tr>
        <td>${fmtDate(b.datum)}</td>
        <td>${o ? o.adresse : "?"}</td>
        <td><span class="tag green">+ Einnahme</span></td>
        <td>${e ? e.name : "–"}</td>
        <td class="num" style="color:var(--green)">+ ${fmtEUR(b.betrag)}</td>
        <td>${b.notiz || ""}</td>
        <td><button class="danger" onclick="deleteMiete('${b.id}')">löschen</button></td>
      </tr>`;
    }
    return `<tr>
      <td>${fmtDate(b.datum)}</td>
      <td>${o ? o.adresse : "?"}</td>
      <td><span class="tag ${b.umlagefaehig ? 'green' : 'red'}">${b.umlagefaehig ? "umlagefähig" : "eigene Kosten"}</span></td>
      <td>${b.kategorie}</td>
      <td class="num" style="color:var(--red)">− ${fmtEUR(b.betrag)}</td>
      <td>${b.beschreibung || ""}</td>
      <td><button class="danger" onclick="deleteKosten('${b.id}')">löschen</button></td>
    </tr>`;
  }).join("");

  if (!rows) rows = `<tr><td colspan="7" class="empty">Noch keine Buchungen erfasst.</td></tr>`;

  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Mieteinnahmen gesamt</div><div class="value green">${fmtEUR(sumEinnahmen)}</div></div>
      <div class="kpi"><div class="label">Kosten umlagefähig</div><div class="value">${fmtEUR(sumUmlage)}</div></div>
      <div class="kpi"><div class="label">Kosten eigene Last</div><div class="value red">${fmtEUR(sumSelbst)}</div></div>
    </div>

    <div class="card">
      <h2>Buchung erfassen</h2>
      <div class="toggle-group" id="buchung-typ-toggle">
        <button type="button" class="toggle-btn active" data-typ="einnahme" onclick="setBuchungTyp('einnahme')">💶 Einnahme</button>
        <button type="button" class="toggle-btn" data-typ="kosten" onclick="setBuchungTyp('kosten')">🧾 Kosten</button>
      </div>

      <form class="inline" id="form-einnahme" onsubmit="addMiete(event)">
        <div class="field"><label>Datum</label><input name="datum" type="date" required></div>
        <div class="field"><label>Objekt</label><select name="objektId" required onchange="updateEinheitOptions(this)">${objOptions}</select></div>
        <div class="field"><label>Einheit</label><select name="einheitId" id="miete-einheit-select"></select></div>
        <div class="field"><label>Betrag (€)</label><input name="betrag" type="number" step="0.01" required></div>
        <div class="field wide"><label>Notiz</label><input name="notiz" placeholder="z.B. Kaltmiete Oktober"></div>
        <button class="primary" type="submit">+ Eintragen</button>
      </form>

      <form class="inline" id="form-kosten" onsubmit="addKosten(event)" style="display:none">
        <div class="field"><label>Datum</label><input name="datum" type="date" required></div>
        <div class="field"><label>Objekt</label><select name="objektId" required>${objOptions}</select></div>
        <div class="field"><label>Kategorie</label><select name="kategorie" onchange="suggestUmlage(this)">${katOptions}</select></div>
        <div class="field"><label>Betrag (€)</label><input name="betrag" type="number" step="0.01" required></div>
        <div class="field checkbox"><input type="checkbox" name="umlagefaehig" id="umlage-checkbox"><label for="umlage-checkbox">umlagefähig</label></div>
        <div class="field wide"><label>Beschreibung</label><input name="beschreibung" placeholder="z.B. Rechnungsnummer, Dienstleister"></div>
        <button class="primary" type="submit">+ Eintragen</button>
      </form>
      <div class="note">Der Haken bei "umlagefähig" wird je nach Kategorie automatisch vorgeschlagen (BetrKV-Faustregel) — jederzeit selbst umstellbar.</div>
    </div>

    <div class="card">
      <h2>Alle Buchungen</h2>
      <table>
        <tr><th>Datum</th><th>Objekt</th><th>Typ</th><th>Kategorie/Einheit</th><th class="num">Betrag</th><th>Notiz</th><th></th></tr>
        ${rows}
      </table>
    </div>`;

  const sel = el.querySelector("select[name=objektId]");
  if (sel) updateEinheitOptions(sel);
}

function setBuchungTyp(typ) {
  document.querySelectorAll("#buchung-typ-toggle .toggle-btn").forEach(b => b.classList.toggle("active", b.dataset.typ === typ));
  document.getElementById("form-einnahme").style.display = typ === "einnahme" ? "flex" : "none";
  document.getElementById("form-kosten").style.display = typ === "kosten" ? "flex" : "none";
}

function updateEinheitOptions(selectEl) {
  const o = getObjekt(selectEl.value);
  const target = document.getElementById("miete-einheit-select");
  if (!target) return;
  target.innerHTML = (o ? o.einheiten : []).map(e => `<option value="${e.id}">${e.name}</option>`).join("");
}

function addMiete(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  DATA.mieteinnahmen.push({
    id: uid(),
    objektId: f.get("objektId"),
    einheitId: f.get("einheitId") || null,
    datum: f.get("datum"),
    betrag: Number(f.get("betrag")),
    notiz: f.get("notiz")
  });
  saveData(); renderAll();
}

function deleteMiete(id) {
  DATA.mieteinnahmen = DATA.mieteinnahmen.filter(m => m.id !== id);
  saveData(); renderAll();
}

function suggestUmlage(selectEl) {
  const box = document.getElementById("umlage-checkbox");
  box.checked = !NICHT_UMLAGEFAEHIG_DEFAULT.has(selectEl.value);
}

function addKosten(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  DATA.kosten.push({
    id: uid(),
    objektId: f.get("objektId"),
    datum: f.get("datum"),
    kategorie: f.get("kategorie"),
    betrag: Number(f.get("betrag")),
    umlagefaehig: f.get("umlagefaehig") === "on",
    beschreibung: f.get("beschreibung")
  });
  saveData(); renderAll();
}

function deleteKosten(id) {
  DATA.kosten = DATA.kosten.filter(k => k.id !== id);
  saveData(); renderAll();
}

let editingFahrzeugId = null;

function renderAutohandel() {
  const el = document.getElementById("view-autohandel");
  const fz = DATA.fahrzeuge || [];
  const bestand = fz.filter(f => f.status === "Bestand");
  const verkauft = fz.filter(f => f.status === "Verkauft");

  const gewinnRealisiert = verkauft.reduce((s, f) => s + (Number(f.verkaufspreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionIst || 0)), 0);
  const gewinnGeplant = bestand.reduce((s, f) => s + (Number(f.zielpreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionGeplant || 0)), 0);

  const rows = fz.map(f => {
    const gewinn = f.status === "Verkauft"
      ? Number(f.verkaufspreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionIst || 0)
      : Number(f.zielpreis || 0) - Number(f.kaufpreis || 0) - Number(f.investitionGeplant || 0);
    const tuevWarn = f.tuevBis && new Date(f.tuevBis + "-01") < new Date() ? ` <span class="tag red">TÜV abgelaufen</span>` : "";
    const fzBild = f.bildDataUrl || f.bildUrl;
    return `<tr>
      <td>${fzBild ? `<img src="${fzBild}" class="objekt-thumb" alt="">` : `<div class="objekt-thumb placeholder">🚗</div>`}</td>
      <td>${f.marke} ${f.modell}${tuevWarn}</td>
      <td class="num">${f.baujahr || "unbekannt"}</td>
      <td>${f.farbe || ""}</td>
      <td class="num">${f.km ? Number(f.km).toLocaleString("de-DE") + " km" : "–"}</td>
      <td><span class="tag ${f.status === "Bestand" ? "gold" : "green"}">${f.status}</span></td>
      <td class="num">${fmtEUR(f.kaufpreis)}</td>
      <td class="num">${fmtEUR(f.status === "Verkauft" ? f.investitionIst : f.investitionGeplant)}</td>
      <td class="num">${f.status === "Verkauft" ? fmtEUR(f.verkaufspreis) : (f.zielpreis ? "Ziel " + fmtEUR(f.zielpreis) : "–")}</td>
      <td class="num" style="color:${gewinn >= 0 ? 'var(--green)' : 'var(--red)'}">${fmtEUR(gewinn)}</td>
      <td>
        <button class="ghost" onclick="editFahrzeug('${f.id}')">bearbeiten</button>
        ${f.status === "Bestand" ? `<button class="ghost" onclick="markFahrzeugVerkauft('${f.id}')">als verkauft markieren</button>` : ""}
        <button class="danger" onclick="deleteFahrzeug('${f.id}')">löschen</button>
      </td>
    </tr>`;
  }).join("") || `<tr><td colspan="10" class="empty">Noch keine Fahrzeuge erfasst.</td></tr>`;

  const edit = editingFahrzeugId ? DATA.fahrzeuge.find(f => f.id === editingFahrzeugId) : null;

  el.innerHTML = `
    <div class="grid-kpi">
      <div class="kpi"><div class="label">Im Bestand</div><div class="value">${bestand.length}</div></div>
      <div class="kpi"><div class="label">Verkauft gesamt</div><div class="value">${verkauft.length}</div></div>
      <div class="kpi"><div class="label">Realisierter Gewinn</div><div class="value green">${fmtEUR(gewinnRealisiert)}</div></div>
      <div class="kpi"><div class="label">Geplanter Gewinn (Bestand)</div><div class="value">${fmtEUR(gewinnGeplant)}</div></div>
    </div>

    <div class="card">
      <h2>${edit ? "Fahrzeug bearbeiten" : "Fahrzeug hinzufügen"}</h2>
      <form class="inline" id="form-fahrzeug" onsubmit="submitFahrzeug(event)">
        <div class="field"><label>Marke</label><input name="marke" required value="${edit ? edit.marke : ""}"></div>
        <div class="field"><label>Modell</label><input name="modell" required value="${edit ? edit.modell : ""}"></div>
        <div class="field"><label>Baujahr</label><input name="baujahr" type="number" value="${edit && edit.baujahr ? edit.baujahr : ""}"></div>
        <div class="field"><label>Farbe</label><input name="farbe" value="${edit ? edit.farbe || "" : ""}"></div>
        <div class="field"><label>Kilometerstand</label><input name="km" type="number" value="${edit && edit.km ? edit.km : ""}"></div>
        <div class="field"><label>TÜV bis (Monat)</label><input name="tuevBis" type="month" value="${edit ? edit.tuevBis || "" : ""}"></div>
        <div class="field"><label>Kaufpreis (€)</label><input name="kaufpreis" type="number" step="0.01" value="${edit ? edit.kaufpreis : ""}"></div>
        <div class="field"><label>Investition geplant (€)</label><input name="investitionGeplant" type="number" step="0.01" value="${edit ? edit.investitionGeplant : ""}"></div>
        <div class="field"><label>Zielverkaufspreis (€)</label><input name="zielpreis" type="number" step="0.01" value="${edit && edit.zielpreis ? edit.zielpreis : ""}"></div>
        <div class="field"><label>Geschäftspartner</label><input name="partner" value="${edit ? edit.partner || "" : ""}"></div>
        <div class="field wide"><label>Bild-URL (optional)</label><input name="bildUrl" placeholder="https://..." value="${edit ? edit.bildUrl || "" : ""}"></div>
        <div class="field"><label>oder Bild-Datei hochladen</label><input name="bildDatei" type="file" accept="image/*"></div>
        <div class="field wide"><label>Notizen</label><input name="notizen" value="${edit ? edit.notizen || "" : ""}"></div>
        <button class="primary" type="submit">${edit ? "Speichern" : "+ Hinzufügen"}</button>
        ${edit ? `<button class="ghost" type="button" onclick="cancelEditFahrzeug()">Abbrechen</button>` : ""}
      </form>
    </div>

    <div class="card">
      <h2>Fahrzeugbestand &amp; Verkäufe</h2>
      <table>
        <tr><th></th><th>Fahrzeug</th><th class="num">Baujahr</th><th>Farbe</th><th class="num">km</th><th>Status</th><th class="num">Kaufpreis</th><th class="num">Investition</th><th class="num">Ziel/Verkauft</th><th class="num">Gewinn</th><th></th></tr>
        ${rows}
      </table>
    </div>`;
}

async function submitFahrzeug(ev) {
  ev.preventDefault();
  const f = new FormData(ev.target);
  const payload = {
    marke: f.get("marke"),
    modell: f.get("modell"),
    baujahr: f.get("baujahr") ? Number(f.get("baujahr")) : null,
    farbe: f.get("farbe"),
    km: f.get("km") ? Number(f.get("km")) : null,
    tuevBis: f.get("tuevBis"),
    kaufpreis: Number(f.get("kaufpreis")) || 0,
    investitionGeplant: Number(f.get("investitionGeplant")) || 0,
    zielpreis: f.get("zielpreis") ? Number(f.get("zielpreis")) : null,
    partner: f.get("partner"),
    bildUrl: f.get("bildUrl") || "",
    notizen: f.get("notizen")
  };

  let bildDataUrl;
  const file = f.get("bildDatei");
  if (file && file.size > 0) {
    try {
      bildDataUrl = await readFileAsDataUrl(file);
    } catch (e) {
      alert("Bild konnte nicht gelesen werden: " + e.message);
    }
  }

  if (editingFahrzeugId) {
    const o = DATA.fahrzeuge.find(x => x.id === editingFahrzeugId);
    Object.assign(o, payload);
    if (bildDataUrl) o.bildDataUrl = bildDataUrl;
    editingFahrzeugId = null;
  } else {
    DATA.fahrzeuge.push({ id: uid(), status: "Bestand", investitionIst: 0, verkaufspreis: null, bildDataUrl: bildDataUrl || null, ...payload });
  }
  saveData(); renderAll();
}

function editFahrzeug(id) {
  editingFahrzeugId = id;
  renderAutohandel();
  const formEl = document.getElementById("form-fahrzeug");
  if (formEl && formEl.scrollIntoView) formEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function cancelEditFahrzeug() {
  editingFahrzeugId = null;
  renderAutohandel();
}

function markFahrzeugVerkauft(id) {
  const f = DATA.fahrzeuge.find(x => x.id === id);
  if (!f) return;
  const preis = prompt(`Verkaufspreis für ${f.marke} ${f.modell} (€):`, f.zielpreis || "");
  if (preis === null) return;
  const investIst = prompt("Tatsächliche Investition bis zum Verkauf (€):", f.investitionGeplant || 0);
  if (investIst === null) return;
  f.status = "Verkauft";
  f.verkaufspreis = Number(preis) || 0;
  f.investitionIst = Number(investIst) || 0;
  saveData(); renderAll();
}

function deleteFahrzeug(id) {
  DATA.fahrzeuge = DATA.fahrzeuge.filter(f => f.id !== id);
  if (editingFahrzeugId === id) editingFahrzeugId = null;
  saveData(); renderAll();
}

function renderDaten() {
  const el = document.getElementById("view-daten");
  el.innerHTML = `
    <div class="card">
      <h2>Daten sichern &amp; übertragen</h2>
      <p class="note">
        Die App speichert alle Daten zentral in der Cloud (Firestore) — derselbe Stand ist automatisch
        auf jedem Gerät sichtbar, auf dem du dich anmeldest (Mac, Handy, später ggf. weitere Nutzer).
        Trotzdem empfiehlt sich ein regelmäßiger Export als zusätzliches Backup, z. B. im Vault-Ordner
        abgelegt. Hochgeladene Fotos werden direkt in diesen Daten mitgespeichert — bei vielen/großen
        Bildern im Zweifel lieber eine Bild-URL statt Datei-Upload verwenden.
      </p>
      <div class="toolbar">
        <button class="primary" onclick="exportData()">⬇️ Als JSON exportieren</button>
        <button class="ghost" onclick="document.getElementById('import-file').click()">⬆️ JSON importieren</button>
        <input type="file" id="import-file" accept="application/json" style="display:none" onchange="importData(event)">
        <button class="ghost" onclick="resetData()">🗑️ Auf Startdaten zurücksetzen</button>
      </div>
    </div>
    <div class="card">
      <h2>Rohdaten (zum Nachschauen)</h2>
      <pre style="white-space:pre-wrap; font-size:11.5px; color:var(--muted); max-height:400px; overflow:auto;">${JSON.stringify(DATA, null, 2)}</pre>
    </div>`;
}

function exportData() {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `immobilien-verwaltung-${stamp}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importData(ev) {
  const file = ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.objekte) throw new Error("Ungültiges Format");
      DATA = parsed;
      saveData(); renderAll();
      alert("Import erfolgreich.");
    } catch (e) {
      alert("Konnte Datei nicht importieren: " + e.message);
    }
  };
  reader.readAsText(file);
}

function resetData() {
  if (!confirm("Wirklich alle Daten löschen und auf die Startdaten zurücksetzen?")) return;
  DATA = defaultData();
  saveData(); renderAll();
}

// ============================================================
// FAHRZEUGBEWERTUNG (Tab) — regelbasiertes Ankauf-/Verkaufswert-Modell,
// wie eine vereinfachte Händler-Faustformel. Keine Live-Marktdaten (reine
// Client-App ohne Server/API) — alle Sätze bewusst einstellbar.
// ============================================================
let fahrzeugbewertungInitialized = false;

// Reine Rechenfunktion, unabhängig vom DOM — testbar ohne Browser.
function fahrzeugBewertung(input) {
  const errors = [];
  const vergleichswert = Number(input.vergleichswert) || 0;
  const zustandNote = Number(input.zustandNote) || 0;

  if (vergleichswert <= 0) errors.push("Vergleichs-Marktwert fehlt oder ist 0.");
  if (zustandNote < 1 || zustandNote > 5) errors.push("Zustandsnote muss zwischen 1 und 5 liegen.");
  if (errors.length) return { errors };

  const zustandFaktoren = { 1: 1.00, 2: 0.90, 3: 0.75, 4: 0.55, 5: 0.35 };
  const zustandFaktor = zustandFaktoren[zustandNote];
  let wert = vergleichswert * zustandFaktor;

  let unfallAbschlagBetrag = 0;
  if (!input.unfallfrei) {
    unfallAbschlagBetrag = wert * (Number(input.unfallAbschlagProzent) || 0) / 100;
    wert -= unfallAbschlagBetrag;
  }

  const vorbesitzer = Math.max(1, Number(input.vorbesitzer) || 1);
  let vorbesitzerAbschlagBetrag = 0;
  if (vorbesitzer > 1) {
    const satz = Math.min(1, (vorbesitzer - 1) * (Number(input.vorbesitzerAbschlagProzent) || 0) / 100);
    vorbesitzerAbschlagBetrag = wert * satz;
    wert -= vorbesitzerAbschlagBetrag;
  }

  let scheckheftZuschlagBetrag = 0;
  if (input.scheckheft) {
    scheckheftZuschlagBetrag = wert * (Number(input.scheckheftZuschlagProzent) || 0) / 100;
    wert += scheckheftZuschlagBetrag;
  }

  let tuevAbschlag = 0;
  if (input.tuevStatus === "bald") tuevAbschlag = Number(input.tuevAbschlagBald) || 0;
  else if (input.tuevStatus === "abgelaufen") tuevAbschlag = Number(input.tuevAbschlagAbgelaufen) || 0;
  wert -= tuevAbschlag;

  const verkaufswert = Math.max(0, wert);

  const handelsspanneProzent = Number(input.handelsspanneProzent) || 0;
  const aufbereitungskosten = Number(input.aufbereitungskosten) || 0;
  const ankaufspreis = Math.max(0, verkaufswert * (1 - handelsspanneProzent/100) - aufbereitungskosten);

  return {
    errors: [],
    zustandFaktor,
    unfallAbschlagBetrag, vorbesitzerAbschlagBetrag, scheckheftZuschlagBetrag, tuevAbschlag,
    verkaufswert,
    handelsspanneProzent, aufbereitungskosten, ankaufspreis
  };
}

function fzAktuelleEingaben() {
  return {
    vergleichswert: Number(document.getElementById("fz-vergleichswert").value) || 0,
    zustandNote: Number(document.getElementById("fz-zustand").value),
    unfallfrei: document.getElementById("fz-unfallfrei").checked,
    vorbesitzer: Number(document.getElementById("fz-vorbesitzer").value) || 1,
    scheckheft: document.getElementById("fz-scheckheft").checked,
    tuevStatus: document.getElementById("fz-tuev").value,
    unfallAbschlagProzent: Number(document.getElementById("fz-unfallsatz").value),
    vorbesitzerAbschlagProzent: Number(document.getElementById("fz-vorbesitzersatz").value),
    scheckheftZuschlagProzent: Number(document.getElementById("fz-scheckheftsatz").value),
    tuevAbschlagBald: Number(document.getElementById("fz-tuevbald").value),
    tuevAbschlagAbgelaufen: Number(document.getElementById("fz-tuevabgelaufen").value),
    handelsspanneProzent: Number(document.getElementById("fz-handelsspanne").value),
    aufbereitungskosten: Number(document.getElementById("fz-aufbereitung").value)
  };
}

function updateFahrzeugbewertung() {
  const el = document.getElementById("fz-ergebnis");
  if (!el) return;
  const input = fzAktuelleEingaben();
  const r = fahrzeugBewertung(input);

  if (r.errors.length) {
    el.innerHTML = `<div class="card"><div class="empty">${r.errors.join("<br>")}</div></div>`;
    return;
  }

  el.innerHTML = `
    <div class="card">
      <div class="grid-kpi">
        <div class="kpi hero"><div class="label">Geschätzter Verkaufswert</div><div class="value">${fmtEUR(r.verkaufswert)}</div></div>
        <div class="kpi hero"><div class="label">Empfohlener Ankaufspreis</div><div class="value">${fmtEUR(r.ankaufspreis)}</div></div>
      </div>
      <h3 style="margin-top:16px">Herleitung des Verkaufswerts</h3>
      <table>
        <tr><th>Position</th><th class="num">Betrag</th></tr>
        <tr><td>Vergleichs-Marktwert</td><td class="num">× ${(r.zustandFaktor*100).toFixed(0)} % Zustand</td></tr>
        ${r.unfallAbschlagBetrag > 0 ? `<tr><td>Unfall-Abschlag</td><td class="num">−${fmtEUR(r.unfallAbschlagBetrag)}</td></tr>` : ""}
        ${r.vorbesitzerAbschlagBetrag > 0 ? `<tr><td>Vorbesitzer-Abschlag</td><td class="num">−${fmtEUR(r.vorbesitzerAbschlagBetrag)}</td></tr>` : ""}
        ${r.scheckheftZuschlagBetrag > 0 ? `<tr><td>Scheckheft-Zuschlag</td><td class="num">+${fmtEUR(r.scheckheftZuschlagBetrag)}</td></tr>` : ""}
        ${r.tuevAbschlag > 0 ? `<tr><td>TÜV-Abschlag</td><td class="num">−${fmtEUR(r.tuevAbschlag)}</td></tr>` : ""}
        <tr class="subtotal"><td>Verkaufswert</td><td class="num">${fmtEUR(r.verkaufswert)}</td></tr>
      </table>
      <div class="formula-note">
        <b>Ankaufspreis-Herleitung:</b><br>
        Verkaufswert (${fmtEUR(r.verkaufswert)}) − Handelsspanne (${r.handelsspanneProzent}%, ${fmtEUR(r.verkaufswert * r.handelsspanneProzent/100)}) − Aufbereitungskosten (${fmtEUR(r.aufbereitungskosten)})<br>
        = <b>${fmtEUR(r.ankaufspreis)}</b>
      </div>
      <div class="note">Basis ist dein eigener Vergleichs-Marktwert (z.B. aus Kleinanzeigen/mobile.de recherchiert) — Zustand, Unfall/Vorbesitzer, Scheckheft und TÜV passen ihn an dein konkretes Fahrzeug an. Keine Alterskurve, kein Neupreis nötig.</div>
    </div>`;
}

// ============================================================
// START: entweder Firebase-Login-Gate oder sofortiger lokaler Modus
// ============================================================
const loginScreen = document.getElementById("login-screen");
const appShell = document.getElementById("app-shell");
const loginForm = document.getElementById("login-form");
const loginError = document.getElementById("login-error");
const loginSubmit = document.getElementById("login-submit");
const sidebarFoot = document.querySelector(".sidebar-foot");

if (!FIREBASE_CONFIGURED) {
  // Firebase noch nicht eingerichtet -- App läuft sofort im lokalen Modus,
  // kein Login nötig (nur der vorgelagerte Basic-Auth-Schutz des Servers).
  // So bleibt die App immer nutzbar, unabhängig davon, wie weit die
  // Cloud-Einrichtung gerade ist.
  loginScreen.style.display = "none";
  appShell.style.display = "";
  sidebarFoot.innerHTML = "Lokaler Modus<br>(Cloud-Sync noch nicht eingerichtet)";
  DATA = loadDataLocal();
  renderAll();
} else {
  // Die Seite selbst ist öffentlich erreichbar (statischer Link) -- aber
  // ohne gültigen Login bei Firebase zeigt sie nur den Login-Screen, nie
  // echte Daten. Jeder mit einem von dir angelegten Firebase-Nutzerkonto
  // (du selbst, später ggf. Angestellte) kann sich anmelden.
  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.textContent = "";
    loginSubmit.disabled = true;
    const email = document.getElementById("login-email").value.trim();
    const password = document.getElementById("login-password").value;
    try {
      await auth.signInWithEmailAndPassword(email, password);
      // onAuthStateChanged unten übernimmt den Rest (Daten laden, App zeigen).
    } catch (err) {
      loginError.textContent = "Anmeldung fehlgeschlagen — E-Mail oder Passwort falsch.";
      console.error("Login fehlgeschlagen:", err);
    } finally {
      loginSubmit.disabled = false;
    }
  });

  document.getElementById("logout-link").addEventListener("click", (e) => {
    e.preventDefault();
    auth.signOut();
  });

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      document.getElementById("sidebar-user-email").textContent = user.email;
      try {
        DATA = await loadData();
      } catch (err) {
        console.error("Daten konnten nicht geladen werden:", err);
        loginScreen.style.display = "flex";
        appShell.style.display = "none";
        loginError.textContent = "Angemeldet, aber Daten konnten nicht geladen werden. Internetverbindung prüfen und Seite neu laden.";
        return;
      }
      loginScreen.style.display = "none";
      appShell.style.display = "";
      renderAll();
      startFirestoreListener();
    } else {
      stopFirestoreListener();
      loginScreen.style.display = "flex";
      appShell.style.display = "none";
      loginForm.reset();
    }
  });
}
</script>
